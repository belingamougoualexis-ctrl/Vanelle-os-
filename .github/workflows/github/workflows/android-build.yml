name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Télécharger le projet
      uses: actions/checkout@v4

    - name: Installer Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Installer Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Décompresser le fichier ZIP
      run: |
        unzip -o *.zip -d dossier_decompresse

    - name: Nettoyer les fichiers non supportés dans res/
      run: |
        find dossier_decompresse -type f -path "*/src/main/res/*" ! -name "*.xml" ! -name "*.png" ! -name "*.jpg" ! -name "*.webp" ! -name "*.gif" -delete || true

    - name: Activer AndroidX partout
      run: |
        # Force la création de gradle.properties dans le home Gradle et dans les dossiers du projet
        mkdir -p ~/.gradle
        echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
        echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

        # Ajoute également dans tous les sous-dossiers trouvés
        find . -type d -exec touch {}/gradle.properties \;
        find . -name "gradle.properties" -exec sh -c 'echo "android.useAndroidX=true" >> "$1"' _ {} \;
        find . -name "gradle.properties" -exec sh -c 'echo "android.enableJetifier=true" >> "$1"' _ {} \;

    - name: Compiler l'APK
      run: |
        PROJ_DIR=$(find dossier_decompresse -name "build.gradle*" -exec dirname {} \; | head -n 1)
        cd "$PROJ_DIR"
        gradle assembleDebug --stacktrace

    - name: Récupérer l'APK
      uses: uses/upload-artifact@v4
      with:
        name: VanelleOS-APK
        path: "**/*.apk"
