name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Télécharger le projet
      uses: actions/checkout@v4

    - name: Installer Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Installer Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Décompresser le fichier ZIP
      run: |
        unzip -o *.zip -d dossier_decompresse

    - name: Nettoyer les fichiers non-images dans res/
      run: |
        # Supprime les fichiers texte/invalides dans les dossiers de ressources res/
        find dossier_decompresse -type f -path "*/src/main/res/*" ! -name "*.xml" ! -name "*.png" ! -name "*.jpg" ! -name "*.webp" ! -name "*.gif" -delete || true

    - name: Activer AndroidX au niveau global
      run: |
        mkdir -p ~/.gradle
        echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
        echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

        # Ajoute également dans le dossier du projet trouvé
        PROJ_DIR=$(find dossier_decompresse -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo "android.useAndroidX=true" >> "$PROJ_DIR/gradle.properties"
        echo "android.enableJetifier=true" >> "$PROJ_DIR/gradle.properties"

    - name: Compiler l'APK
      run: |
        PROJ_DIR=$(find dossier_decompresse -name "build.gradle*" -exec dirname {} \; | head -n 1)
        cd "$PROJ_DIR"
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Récupérer l'APK
      uses: actions/upload-artifact@v4
      with:
        name: VanelleOS-APK
        path: "**/*.apk"
