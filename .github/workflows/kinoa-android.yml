name: KINOA Android
on:
  push:
    branches: [kinoa]
    paths: ["kinoa/android/**"]
  pull_request:
    branches: [kinoa]
    paths: ["kinoa/android/**"]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinoa/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kinoa-debug-apk
          path: kinoa/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
