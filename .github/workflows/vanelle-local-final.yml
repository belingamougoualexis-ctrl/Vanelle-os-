:root{font-family:Segoe UI,Arial,sans-serif;color:#111827;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{border:1px solid #dbe2ea;background:#fff;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:650}button:hover{border-color:#2563eb}.shell{display:grid;grid-template-columns:280px 1fr;height:100vh}aside{background:#fff;border-right:1px solid #e5eaf1;padding:26px;display:flex;flex-direction:column;gap:18px}.brand{font-size:25px;font-weight:800}.brand span{font-size:11px;color:#2563eb;letter-spacing:1.5px}.title{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase}.model{width:100%;text-align:left}.model small{display:block;color:#64748b;font-size:11px;margin-top:3px}.model.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.note{margin-top:auto;color:#64748b;font-size:13px;line-height:1.6}.muted{color:#94a3b8;font-size:13px}main{display:flex;flex-direction:column;min-width:0}header{height:86px;background:#fff;border-bottom:1px solid #e5eaf1;padding:18px 30px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#64748b;font-size:13px}#messages{flex:1;overflow:auto;padding:30px 12%;display:flex;flex-direction:column;gap:18px}.empty{text-align:center;margin:auto;color:#64748b}.empty h2{color:#111827}.user,.assistant{max-width:820px;width:fit-content;padding:15px 18px;border-radius:16px;line-height:1.65}.user{align-self:flex-end;background:#2563eb;color:#fff}.assistant{align-self:flex-start;background:#fff;border:1px solid #e2e8f0}.user b,.assistant b{display:block;font-size:12px;margin-bottom:5px;opacity:.75}footer{background:#fff;border-top:1px solid #e5eaf1;padding:16px 12% 20px}textarea{width:100%;min-height:76px;resize:vertical;border:1px solid #d9e0ea;border-radius:14px;padding:14px;outline:none;background:#fbfdff}.bar{display:flex;justify-content:space-between;align-items:center;color:#94a3b8;font-size:12px;margin-top:8px}.bar button{background:#2563eb;color:#fff;border-color:#2563eb}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{display:none}#messages,footer{padding-left:18px;padding-right:18px}}
