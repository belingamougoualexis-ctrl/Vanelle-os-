name: Vanelle Local Windows Build
on:
  push:
    branches: [vanelle-local-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner check
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          rustc --version
          cargo --version
          node --version
          cmake --version
