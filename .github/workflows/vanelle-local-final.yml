name: Vanelle 2.0 Windows CI and Release

on:
  workflow_dispatch:
  push:
    branches:
      - vanelle-local-final

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Vulkan
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          install_lavapipe: true
          cache: true
          stripdown: true
      - name: Build Vanelle and local engines
        shell: pwsh
        run: ./scripts/build-vanelle.ps1
      - name: Rust unit tests
        shell: pwsh
        run: cargo test --manifest-path "out/src-tauri/Cargo.toml"
      - name: Verify application and engines
        shell: pwsh
        run: |
          $base="out/src-tauri"; $release="out/src-tauri/target/x86_64-pc-windows-msvc/release"; $bundle="$release/bundle/nsis"
          $required=@(
            "$base/binaries/llama-server-cpu-x86_64-pc-windows-msvc.exe",
            "$base/binaries/llama-server-vulkan-x86_64-pc-windows-msvc.exe",
            "$base/binaries/llama-finetune-lora-x86_64-pc-windows-msvc.exe",
            "$base/binaries/llama-finetune-lora-vulkan-x86_64-pc-windows-msvc.exe",
            "$base/binaries/llama-export-lora-x86_64-pc-windows-msvc.exe",
            "$base/binaries/llama-export-lora-vulkan-x86_64-pc-windows-msvc.exe",
            "$base/binaries/llama-perplexity-x86_64-pc-windows-msvc.exe"
          )
          foreach($p in $required){if(!(Test-Path $p)){throw "Binaire manquant: $p"}}
          if(!(Get-ChildItem $release -Filter "vanelle-local.exe" -File)){throw "Executable Vanelle manquant"}
          if(!(Get-ChildItem $bundle -Filter "*.exe" -File)){throw "Installateur NSIS manquant"}
      - name: Real local chat test
        shell: pwsh
        run: |
          $model="$env:RUNNER_TEMP\tinyllama-q2.gguf"
          Invoke-WebRequest -Uri "https://huggingface.co/tensorblock/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/TinyLlama-1.1B-Chat-v1.0-Q2_K.gguf?download=true" -OutFile $model -UseBasicParsing
          if((Get-Item $model).Length -lt 100MB){throw "GGUF de test incomplet"}
          $server=(Get-ChildItem "out/src-tauri/binaries" -Filter "llama-server-cpu-*.exe"|Select-Object -First 1).FullName
          $p=Start-Process $server -ArgumentList @("-m",$model,"--host","127.0.0.1","--port","18281","--ctx-size","512","--n-gpu-layers","0","--jinja") -PassThru -WindowStyle Hidden
          try{
            $ready=$false
            1..120|ForEach-Object{if(!$ready){try{$h=Invoke-WebRequest "http://127.0.0.1:18281/health" -UseBasicParsing;if($h.StatusCode -eq 200){$ready=$true}}catch{};Start-Sleep -Milliseconds 500}}
            if(!$ready){throw "Serveur local non prêt"}
            $body=@{model="tinyllama";messages=@(@{role="user";content="Réponds avec un texte non vide."});max_tokens=32;temperature=0;stream=$false}|ConvertTo-Json -Depth 6
            $z=Invoke-RestMethod "http://127.0.0.1:18281/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body
            if([string]::IsNullOrWhiteSpace([string]$z.choices[0].message.content)){throw "Réponse locale vide"}
            Write-Host "LOCAL_CHAT_OK"
          }finally{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
      - name: Real LoRA training, inference and merge test
        shell: pwsh
        run: |
          $model="$env:RUNNER_TEMP\qwen3-0.6b-q8.gguf"; $dataset="$env:RUNNER_TEMP\vanelle-training.jsonl"; $adapter="$env:RUNNER_TEMP\vanelle-adapter.gguf"; $merged="$env:RUNNER_TEMP\vanelle-merged.gguf"
          Invoke-WebRequest -Uri "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true" -OutFile $model -UseBasicParsing
          if((Get-Item $model).Length -lt 500MB){throw "Qwen GGUF de test incomplet"}
          @(
            '{"messages":[{"role":"user","content":"Quel est le code Vanelle ?"},{"role":"assistant","content":"VANELLE_TRAIN_OK."}]}'
            '{"messages":[{"role":"user","content":"Donne le code Vanelle."},{"role":"assistant","content":"VANELLE_TRAIN_OK."}]}'
            '{"messages":[{"role":"user","content":"Répète le code."},{"role":"assistant","content":"VANELLE_TRAIN_OK."}]}'
            '{"messages":[{"role":"user","content":"Quel texte valide ce test ?"},{"role":"assistant","content":"VANELLE_TRAIN_OK."}]}'
          )|Set-Content -Path $dataset -Encoding utf8
          $trainer=(Get-ChildItem "out/src-tauri/binaries" -Filter "llama-finetune-lora-*.exe"|Where-Object{$_.Name -notmatch "-vulkan-"}|Select-Object -First 1).FullName
          if(!$trainer){throw "Trainer CPU introuvable"}
          & $trainer -m $model -f $dataset --output-adapter $adapter --assistant-loss-only -c 128 -b 1 -ub 1 -ngl 0 -fa off --lora-rank 4 --lora-alpha 8 --lora-modules "attn_q,attn_k,attn_v,attn_o" --learning-rate 1e-5 --num-epochs 1 --checkpoint-save-steps 1000
          if($LASTEXITCODE -ne 0){throw "Entraînement LoRA en échec"}
          if(!(Test-Path $adapter)-or (Get-Item $adapter).Length -lt 10000){throw "Adaptateur LoRA absent"}
          $server=(Get-ChildItem "out/src-tauri/binaries" -Filter "llama-server-cpu-*.exe"|Select-Object -First 1).FullName
          $p=Start-Process $server -ArgumentList @("-m",$model,"--lora",$adapter,"--alias","trained-test","--host","127.0.0.1","--port","18282","--ctx-size","256","--n-gpu-layers","0","--jinja") -PassThru -WindowStyle Hidden
          try{
            $ready=$false
            1..120|ForEach-Object{if(!$ready){try{$h=Invoke-WebRequest "http://127.0.0.1:18282/health" -UseBasicParsing;if($h.StatusCode -eq 200){$ready=$true}}catch{};Start-Sleep -Milliseconds 500}}
            if(!$ready){throw "Serveur LoRA non prêt"}
            $body=@{model="trained-test";messages=@(@{role="user";content="Quel est le code Vanelle ?"});max_tokens=32;temperature=0;stream=$false}|ConvertTo-Json -Depth 6
            $z=Invoke-RestMethod "http://127.0.0.1:18282/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body
            if([string]::IsNullOrWhiteSpace([string]$z.choices[0].message.content)){throw "Inférence LoRA vide"}
            Write-Host "LORA_INFERENCE_OK"
          }finally{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          $exporter=(Get-ChildItem "out/src-tauri/binaries" -Filter "llama-export-lora-*.exe"|Where-Object{$_.Name -notmatch "-vulkan-"}|Select-Object -First 1).FullName
          if(!$exporter){throw "Export LoRA introuvable"}
          & $exporter -m $model --lora $adapter -o $merged
          if($LASTEXITCODE -ne 0){throw "Fusion LoRA en échec"}
          if(!(Test-Path $merged)-or (Get-Item $merged).Length -lt 100000){throw "Modèle fusionné absent"}
          Write-Host "LORA_PIPELINE_OK"
      - name: Vanelle app launch test
        shell: pwsh
        run: |
          $model="$env:RUNNER_TEMP\tinyllama-q2.gguf"; $dir=Join-Path $env:APPDATA "com.vanelle.local\models"
          New-Item -ItemType Directory -Force -Path $dir|Out-Null
          Copy-Item $model (Join-Path $dir "tinyllama-q2.gguf") -Force
          $exe=(Get-ChildItem "out/src-tauri/target/x86_64-pc-windows-msvc/release" -Filter "vanelle-local.exe"|Select-Object -First 1).FullName
          $p=Start-Process $exe -PassThru -WindowStyle Hidden
          try{
            $ready=$false
            1..160|ForEach-Object{if(!$ready){try{$h=Invoke-WebRequest "http://127.0.0.1:18280/health" -UseBasicParsing;if($h.StatusCode -eq 200){$ready=$true}}catch{};Start-Sleep -Milliseconds 500}}
            if(!$ready){throw "Vanelle engine did not start"}
            $body=@{model="tinyllama-q2";messages=@(@{role="user";content="Réponds avec un texte non vide."});max_tokens=32;temperature=0;stream=$false}|ConvertTo-Json -Depth 6
            $z=Invoke-RestMethod "http://127.0.0.1:18280/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body
            if([string]::IsNullOrWhiteSpace([string]$z.choices[0].message.content)){throw "Vanelle chat vide"}
            Write-Host "APP_CHAT_OK"
          }finally{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
      - name: Prepare release assets
        shell: pwsh
        run: |
          $out="release-assets"; New-Item -ItemType Directory -Force -Path $out|Out-Null
          $setup=(Get-ChildItem "out/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -File|Sort-Object LastWriteTime -Descending|Select-Object -First 1).FullName
          $portable=(Get-ChildItem "out/src-tauri/target/x86_64-pc-windows-msvc/release" -Filter "vanelle-local.exe" -File|Select-Object -First 1).FullName
          Copy-Item $setup "$out\Vanelle-2.0-Windows-x64-Setup.exe" -Force
          Copy-Item $portable "$out\Vanelle-2.0-Windows-x64-Portable.exe" -Force
          Compress-Archive -Path "$out\*" -DestinationPath "$out\Vanelle-2.0-Windows-x64.zip" -Force
          Get-ChildItem $out|Select-Object Name,Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanelle-2.0-Windows-x64
          path: release-assets/*
          if-no-files-found: error
      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          $tag="vanelle-local-latest"
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag "release-assets/Vanelle-2.0-Windows-x64-Setup.exe" "release-assets/Vanelle-2.0-Windows-x64-Portable.exe" "release-assets/Vanelle-2.0-Windows-x64.zip" --target $env:GITHUB_SHA --title "Vanelle 2.0 Windows x64" --notes "Vanelle AI Engineering Studio. CI validates compilation, local chat, LoRA training, adapter inference and merge." --latest=false
