#![cfg_attr(not(debug_assertions),windows_subsystem="windows")]
use anyhow::{anyhow,Result};
use futures_util::StreamExt;
use std::{fs,path::{Path,PathBuf},sync::Arc,time::Duration};
use tauri::{Emitter,Manager,State};
use tauri_plugin_shell::ShellExt;
use tokio::sync::Mutex;
#[derive(Clone,serde::Serialize,serde::Deserialize,Default)]struct Model{id:String,path:String,size_bytes:u64}
#[derive(Clone,serde::Serialize,serde::Deserialize)]struct Msg{role:String,content:String}
struct AppState{model:Mutex<Option<Model>>,child:Mutex<Option<tauri_plugin_shell::process::CommandChild>>,dir:PathBuf}
fn data_dir(app:&tauri::AppHandle)->Result<PathBuf>{Ok(app.path().app_data_dir()?)}
fn scan(dir:&Path)->Result<Vec<Model>>{fs::create_dir_all(dir)?;let mut v=Vec::new();for e in fs::read_dir(dir)?{let p=e?.path();if p.extension().and_then(|x|x.to_str()).map(|x|x.eq_ignore_ascii_case("gguf"))!=Some(true){continue}let m=fs::metadata(&p)?;v.push(Model{id:p.file_stem().and_then(|x|x.to_str()).unwrap_or("model").to_string(),path:p.to_string_lossy().into_owned(),size_bytes:m.len()})}v.sort_by(|a,b|a.id.cmp(&b.id));Ok(v)}
fn valid(p:&Path)->Result<()>{use std::io::Read;let mut f=fs::File::open(p)?;let mut m=[0u8;4];f.read_exact(&mut m)?;if &m!=b"GGUF"{return Err(anyhow!("Fichier invalide : ce n'est pas un GGUF."))}Ok(())}
async fn start(app:&tauri::AppHandle,s:&AppState)->Result<()>{if let Some(c)=s.child.lock().await.take(){let _=c.kill();}let m=match s.model.lock().await.clone(){Some(x)=>x,None=>return Ok(())};let args=vec!["--model".into(),m.path,"--alias".into(),m.id,"--host".into(),"127.0.0.1".into(),"--port".into(),"18280".into(),"--ctx-size".into(),"4096".into(),"--jinja".into(),"--no-webui".into()];let (_rx,c)=app.shell().sidecar("llama-server")?.args(args).spawn()?;*s.child.lock().await=Some(c);let c=reqwest::Client::new();for _ in 0..120{if c.get("http://127.0.0.1:18280/health").send().await.map(|r|r.status().is_success()).unwrap_or(false){return Ok(())}tokio::time::sleep(Duration::from_millis(250)).await}Err(anyhow!("Le moteur local n'a pas démarré. Vérifiez le modèle et la mémoire."))}
#[tauri::command]async fn list_models(s:State<'_,Arc<AppState>>)->Result<Vec<Model>,String>{scan(&s.dir).map_err(|e|e.to_string())}
#[tauri::command]async fn import_model(s:State<'_,Arc<AppState>>,path:String)->Result<Model,String>{let p=Path::new(&path);valid(p).map_err(|e|e.to_string())?;fs::create_dir_all(&s.dir).map_err(|e|e.to_string())?;let name=p.file_name().ok_or("Nom invalide").map_err(String::from)?;let d=s.dir.join(name);fs::copy(p,&d).map_err(|e|e.to_string())?;scan(&s.dir).map_err(|e|e.to_string())?.into_iter().find(|m|m.path==d.to_string_lossy()).ok_or_else(||"Modèle importé introuvable".into())}
#[tauri::command]async fn current_model(s:State<'_,Arc<AppState>>)->Result<String,String>{Ok(s.model.lock().await.as_ref().map(|m|m.id.clone()).unwrap_or_default())}
#[tauri::command]async fn set_model(app:tauri::AppHandle,s:State<'_,Arc<AppState>>,id:String)->Result<(),String>{let m=scan(&s.dir).map_err(|e|e.to_string())?.into_iter().find(|m|m.id==id).ok_or("Modèle introuvable")?;*s.model.lock().await=Some(m);start(&app,&s).await.map_err(|e|e.to_string())}
#[tauri::command]async fn chat(app:tauri::AppHandle,s:State<'_,Arc<AppState>>,messages:Vec<Msg>)->Result<(),String>{if s.model.lock().await.is_none(){return Err("Aucun modèle local sélectionné.".into())}let c=reqwest::Client::new();if !c.get("http://127.0.0.1:18280/health").send().await.map(|r|r.status().is_success()).unwrap_or(false){start(&app,&s).await.map_err(|e|e.to_string())?}let body=serde_json::json!({"messages":messages,"temperature":0.7,"max_tokens":1024,"stream":true});let r=c.post("http://127.0.0.1:18280/v1/chat/completions").json(&body).send().await.map_err(|e|e.to_string())?.error_for_status().map_err(|e|e.to_string())?;let mut stream=r.bytes_stream();let mut buf=String::new();while let Some(x)=stream.next().await{buf.push_str(&String::from_utf8_lossy(&x.map_err(|e|e.to_string())?));while let Some(i)=buf.find("\n\n"){let f=buf[..i].to_string();buf.drain(..i+2);for line in f.lines(){if !line.starts_with("data:"){continue}let p=line.trim_start_matches("data:").trim();if p=="[DONE]"{continue}if let Ok(v)=serde_json::from_str::<serde_json::Value>(p){if let Some(d)=v["choices"][0]["delta"]["content"].as_str(){if !d.is_empty(){app.emit("chat://chunk",serde_json::json!({"delta":d})).map_err(|e|e.to_string())?}}}}}}app.emit("chat://chunk",serde_json::json!({"done":true})).map_err(|e|e.to_string())?;Ok(())}
fn run()->Result<()>{tauri::Builder::default().plugin(tauri_plugin_shell::init()).plugin(tauri_plugin_dialog::init()).setup(|app|{let d=data_dir(app)?.join("models");fs::create_dir_all(&d)?;let initial=scan(&d)?.first().cloned();let s=Arc::new(AppState{model:Mutex::new(initial),child:Mutex::new(None),dir:d});app.manage(s.clone());if s.model.blocking_lock().is_some(){let h=app.handle().clone();tauri::async_runtime::spawn(async move{let _=start(&h,&s).await;});}Ok(())}).invoke_handler(tauri::generate_handler![list_models,import_model,current_model,set_model,chat]).run(tauri::generate_context!()).map_err(|e|anyhow!(e.to_string()))?;Ok(())}
fn main(){run().expect("Vanelle Local failed");}
'@ | Set-Content local-ai/src-tauri/src/main.rs -Encoding utf8
      - name: Build llama.cpp sidecar
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$env:RUNNER_TEMP/llama.cpp"
          cmake -S "$env:RUNNER_TEMP/llama.cpp" -B "$env:RUNNER_TEMP/llama-build" -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=OFF -DGGML_BACKEND_DL=OFF -DGGML_VULKAN=ON -DGGML_CPU_ALL_VARIANTS=ON
          cmake --build "$env:RUNNER_TEMP/llama-build" --config Release --target llama-server -j 2
          New-Item -ItemType Directory -Force -Path local-ai/src-tauri/binaries | Out-Null
          Copy-Item "$env:RUNNER_TEMP/llama-build/bin/Release/llama-server.exe" "local-ai/src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe"
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: x86_64-pc-windows-msvc}
      - name: Install dependencies
        working-directory: local-ai
        run: npm install
      - name: Build installer
        working-directory: local-ai
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Vanelle-Local-Windows-x64
          path: local-ai/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
          if-no-files-found: error
