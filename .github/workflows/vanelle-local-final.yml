name: Vanelle Local Final Windows
on:
  push:
    branches: [vanelle-local-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Create app source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path local-ai/src,local-ai/src-tauri/src,local-ai/src-tauri/capabilities | Out-Null
          @'
{"name":"vanelle-local-final","private":true,"version":"1.0.0","type":"module","scripts":{"build":"vite build","tauri":"tauri","tauri:build":"tauri build"},"dependencies":{"@tauri-apps/api":"^2.8.0","@tauri-apps/plugin-dialog":"^2.3.0"},"devDependencies":{"@tauri-apps/cli":"^2.8.0","vite":"^7.1.7"}}
'@ | Set-Content local-ai/package.json -Encoding utf8
          @'
<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanelle Local</title></head><body><div id="app"></div><script type="module" src="/src/main.js"></script></body></html>
'@ | Set-Content local-ai/index.html -Encoding utf8
          @'
import { invoke } from "@tauri-apps/api/core";
import { listen } from "@tauri-apps/api/event";
import { open } from "@tauri-apps/plugin-dialog";
import "./style.css";
const S={model:"",models:[],messages:JSON.parse(localStorage.getItem("vanelle.messages")||"[]"),busy:false};
const app=document.querySelector("#app");
app.innerHTML='<div class="shell"><aside><div class="brand">Vanelle <span>LOCAL</span></div><button id="new">Nouvelle conversation</button><div class="title">Modèles locaux</div><div id="models"></div><p class="note">Le moteur fonctionne sur cet ordinateur. Aucun fournisseur IA externe n’est requis.</p></aside><main><header><div><h1>Assistant local</h1><p id="status">Initialisation…</p></div><button id="import">Importer un GGUF</button></header><section id="messages"></section><footer><textarea id="input" placeholder="Écrivez votre message…"></textarea><div class="bar"><span>Entrée pour envoyer · Maj+Entrée pour une nouvelle ligne</span><button id="send">Envoyer</button></div></footer></main></div>';
const $=s=>document.querySelector(s); const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function render(){const box=$("#messages");box.innerHTML=S.messages.length?S.messages.map(m=>'<article class="'+m.role+'"><b>'+(m.role==="user"?"Vous":"Vanelle")+'</b><div>'+esc(m.content).replace(/\n/g,"<br>")+'</div></article>').join(""):'<div class="empty"><h2>Votre IA locale</h2><p>Importez un modèle GGUF puis posez votre question.</p></div>';box.scrollTop=box.scrollHeight;localStorage.setItem("vanelle.messages",JSON.stringify(S.messages));}
function renderModels(){$("#models").innerHTML=S.models.length?S.models.map(m=>'<button class="model '+(m.id===S.model?'active':'')+'" data-id="'+esc(m.id)+'">'+esc(m.id)+'<small>'+(m.size_bytes/1073741824).toFixed(2)+' Go</small></button>').join(""):'<div class="muted">Aucun GGUF importé.</div>';document.querySelectorAll(".model").forEach(b=>b.onclick=()=>selectModel(b.dataset.id));}
async function refresh(){try{S.models=await invoke("list_models");S.model=await invoke("current_model");renderModels();$("#status").textContent=S.model?"Modèle actif : "+S.model:"Aucun modèle sélectionné";}catch(e){$("#status").textContent=String(e)}}
async function selectModel(id){try{await invoke("set_model",{id});S.model=id;$("#status").textContent="Modèle actif : "+id;renderModels();}catch(e){$("#status").textContent=String(e)}}
async function send(){const text=$("#input").value.trim();if(!text||S.busy)return;if(!S.model){$("#status").textContent="Importez d’abord un modèle GGUF.";return}S.messages.push({role:"user",content:text},{role:"assistant",content:""});$("#input").value="";S.busy=true;$("#send").disabled=true;render();try{await invoke("chat",{messages:S.messages.slice(0,-1)})}catch(e){S.messages.pop();$("#status").textContent=String(e);render()}S.busy=false;$("#send").disabled=false;}
listen("chat://chunk",e=>{const p=e.payload;if(p.error){$("#status").textContent=p.error;S.busy=false;$("#send").disabled=false;return}if(p.delta){S.messages[S.messages.length-1].content+=p.delta;render()}if(p.done){S.busy=false;$("#send").disabled=false;}});
$("#send").onclick=send;$("#input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#new").onclick=()=>{S.messages=[];render()};$("#import").onclick=async()=>{const p=await open({multiple:false,filters:[{name:"Modèle GGUF",extensions:["gguf"]}]});if(typeof p!=="string")return;try{const m=await invoke("import_model",{path:p});await selectModel(m.id);await refresh()}catch(e){$("#status").textContent=String(e)}};render();refresh();
