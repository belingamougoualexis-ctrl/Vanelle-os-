name: KINOA CI
on:
  push:
    branches: [kinoa]
  pull_request:
    branches: [kinoa]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: kinoa/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s kinoa/web/index.html && test -s kinoa/web/app.js && test -s kinoa/web/style.css
  truth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! grep -R -iE 'fake video|mock video|simulat(e|ion)[[:space:]]+video|pre-made video' kinoa/web"
