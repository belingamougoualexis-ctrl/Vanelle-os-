name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompression de l'archive si présente
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration de JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Corrections structurelles des fichiers Kotlin
      - name: Nettoyage et correction des fichiers source
        run: |
          python3 - << 'EOF'
          import os, re, glob

          def find_files(pattern):
              return glob.glob(f"./**/{pattern}", recursive=True)

          # --- FIX 1: ContactsRepository.kt ---
          for path in find_files("ContactsRepository.kt"):
              print(f"Nettoyage : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # Suppression uniquement des échappements invalides \% et \_
              content = content.replace(r'\%', '%').replace(r'\_', '_')
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- FIX 2: Fragments.kt ---
          for path in find_files("Fragments.kt"):
              print(f"Nettoyage des doublons : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              seen_in_scope = set()

              for line in lines:
                  if any(clause in line for clause in ["fun ", "override", "class "]):
                      seen_in_scope.clear()

                  match = re.search(r"^\s*val\s+(legalCol|privacyBtn|termsBtn)\b", line)
                  if match:
                      var_name = match.group(1)
                      if var_name in seen_in_scope:
                          # Remplace la déclaration 'val x = ...' par une affectation 'x = ...'
                          line = re.sub(r'\bval\s+', '', line, count=1)
                      else:
                          seen_in_scope.add(var_name)
                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # --- FIX 3: MemoryVault.kt ---
          for path in find_files("MemoryVault.kt"):
              print(f"Ajout d'imports : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              imports = "\nimport androidx.security.crypto.MasterKey\nimport androidx.security.crypto.EncryptedSharedPreferences\n"
              if "import androidx.security.crypto" not in content:
                  content = re.sub(r'(package\s+[^\n]+)', r'\1' + imports, content, count=1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- FIX 4: build.gradle ---
          gradle_files = find_files("build.gradle") + find_files("build.gradle.kts")
          for path in gradle_files:
              if "app" in path:
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  if "security-crypto" not in content:
                      dep = '\n    implementation "androidx.security:security-crypto:1.1.0-alpha06"\n'
                      content = re.sub(r'dependencies\s*\{', 'dependencies {' + dep, content, count=1)
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          EOF

      # 4. Compilation avec capture d'erreurs lisible
      - name: Compiler avec Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi

          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew

          # Exécution de la compilation
          ./gradlew assembleDebug > gradle_build.log 2>&1 || BUILD_FAILED=true

          if [ "$BUILD_FAILED" = "true" ]; then
            echo "=================================================="
            echo "       ERREURS DE COMPILATION KOTLIN DETECTEES    "
            echo "=================================================="
            grep -E "e: file://|error:" gradle_build.log || tail -n 50 gradle_build.log
            echo "=================================================="
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Export de l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
