name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configuration de Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Injection des règles ProGuard / R8
        run: |
          PROGUARD_FILE="app/proguard-rules.pro"
          mkdir -p app
          echo "" >> "$PROGUARD_FILE"
          echo "# Correctifs automatiques GitHub Actions" >> "$PROGUARD_FILE"
          echo "-dontwarn javax.annotation.**" >> "$PROGUARD_FILE"
          echo "-dontwarn com.google.api.client.**" >> "$PROGUARD_FILE"
          echo "-dontwarn org.joda.time.**" >> "$PROGUARD_FILE"
          echo "-keep class com.google.crypto.tink.** { *; }" >> "$PROGUARD_FILE"

      - name: 5. Génération automatique du Keystore de signature
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: 6. Compilation de l'APK Release sans wrapper
        run: gradle assembleRelease --stacktrace

      - name: 7. Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*-unsigned.apk" -o -name "*-release.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun fichier APK trouvé après la compilation."
            exit 1
          fi

          echo "APK non signé trouvé : $UNSIGNED_APK"

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk app-aligned.apk

      - name: 8. Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Release-APK
          path: VanelleOS-release-signed.apk
          if-no-files-found: error
