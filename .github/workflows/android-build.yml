name: AlphaPrime CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Trouver le paquet AlphaPrime
        shell: pwsh
        run: |
          $zip = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "AlphaPrime_*.zip" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.git[\\/]' -and
              $_.FullName -notmatch '[\\/]dist[\\/]' -and
              $_.FullName -notmatch '[\\/]build[\\/]'
            } |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $zip) {
            Write-Error "Aucun fichier AlphaPrime_*.zip trouvé."
            exit 1
          }

          Write-Host "ZIP trouvé : $($zip.FullName)"
          "ALPHAPRIME_ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extraire AlphaPrime
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "AlphaPrime"

          if (Test-Path $project) {
            Remove-Item $project -Recurse -Force
          }

          New-Item -ItemType Directory -Path $project -Force | Out-Null

          Expand-Archive `
            -Path $env:ALPHAPRIME_ZIP `
            -DestinationPath $project `
            -Force

          $req = Get-ChildItem `
            -Path $project `
            -Filter "requirements.txt" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $req) {
            Write-Error "requirements.txt introuvable dans AlphaPrime."
            Get-ChildItem $project -Recurse -File | Select-Object FullName
            exit 1
          }

          $root =$req.Directory.FullName

          Write-Host "Projet AlphaPrime : $root"
          Write-Host "Requirements : $($req.FullName)"

          "PROJECT_ROOT=$root" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REQUIREMENTS_FILE=$($req.FullName)" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier Python
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Installer les dépendances
        shell: pwsh
        run: |
          Set-Location -Path $env:PROJECT_ROOT
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "$env:REQUIREMENTS_FILE"

      - name: Vérifier les dépendances
        shell: pwsh
        run: |
          Set-Location -Path $env:PROJECT_ROOT
          python -m pip check
