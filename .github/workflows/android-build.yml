name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances de base
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests réels du projet
        run: python run_tests.py

      - name: Construire l'exécutable (PyInstaller)
        run: python build_executable.py

      - name: Publier l'exécutable comme artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: AlphaPrime-Windows
          path: dist/AlphaPrime/
