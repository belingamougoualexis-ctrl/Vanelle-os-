name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraire le projet et compiler l APK release
        run: |
          set -euo pipefail
          ls -la
          find . -maxdepth 2 -type f -name "*.zip" -print0 | while IFS= read -r -d '' z; do
            echo "Decompression de $z"
            unzip -o "$z"
          done
          ls -la
          if [ -f ./VanelleRelance/settings.gradle.kts ]; then
            ANDROID_DIR=./VanelleRelance
          elif [ -f ./settings.gradle.kts ]; then
            ANDROID_DIR=.
          else
            GRADLE_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
            if [ -z "$GRADLE_FILE" ]; then
              echo "ERREUR: settings.gradle.kts introuvable"
              find . -maxdepth 5 -type f | head -50
              exit 1
            fi
            ANDROID_DIR=$(dirname "$GRADLE_FILE")
          fi
          echo "ANDROID_DIR=$ANDROID_DIR"
          cd "$ANDROID_DIR"
          ls -la
          touch gradle.properties
          grep -q android.useAndroidX gradle.properties || echo android.useAndroidX=true >> gradle.properties
          grep -q android.enableJetifier gradle.properties || echo android.enableJetifier=true >> gradle.properties
          if [ ! -f ./gradlew ]; then
            echo "ERREUR: gradlew manquant"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Aligner et signer l APK
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find . -name "*.apk" | head -n 1)
          fi
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Erreur: aucun APK"
            exit 1
          fi
          echo "APK trouve: $UNSIGNED_APK"

          SDK=""
          if [ -n "${ANDROID_HOME:-}" ]; then SDK="$ANDROID_HOME"; fi
          if [ -z "\( SDK" ] && [ -n " \){ANDROID_SDK_ROOT:-}" ]; then SDK="$ANDROID_SDK_ROOT"; fi
          if [ -z "$SDK" ] && [ -d "$HOME/Android/Sdk" ]; then SDK="$HOME/Android/Sdk"; fi
          if [ -z "$SDK" ] && [ -d /usr/local/lib/android/sdk ]; then SDK=/usr/local/lib/android/sdk; fi
          if [ -z "$SDK" ]; then
            echo "ERREUR: SDK introuvable"
            env | grep -i android || true
            exit 1
          fi
          echo "SDK=$SDK"

          BUILD_TOOLS_DIR=$(ls -d "$SDK"/build-tools/* | sort | tail -n 1)
          echo "Build-tools=$BUILD_TOOLS_DIR"

          keytool -genkeypair -v -keystore autogenerated.jks -alias autokey -keyalg RSA -keysize 2048 -validity 10000 -storepass automatch123 -keypass automatch123 -dname "CN=GitHubActions,OU=Build,O=Vanelle,L=City,ST=State,C=US"

          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks autogenerated.jks --ks-pass pass:automatch123 --key-pass pass:automatch123 --ks-key-alias autokey --out VanelleRelance-release-signed.apk app-aligned.apk
          ls -la VanelleRelance-release-signed.apk

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle Relance ${{ github.run_number }}
          body: APK release signe automatiquement. Desinstallez l ancienne version si la signature a change.
          files: VanelleRelance-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanelleRelance-release-signed-${{ github.run_number }}
          path: VanelleRelance-release-signed.apk
          retention-days: 30
