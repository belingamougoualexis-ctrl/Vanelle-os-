name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Le paquet legacy 'tools' n'existe plus dans les dépôts Google SDK.
          # build-tools / platforms sont téléchargés automatiquement par le
          # plugin Android Gradle pendant le build (licences déjà acceptées).
          packages: 'platform-tools'

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraire le projet web
        run: |
          set -euo pipefail

          echo "=== Contenu du dépôt ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERREUR : aucun .zip trouvé à la racine du dépôt."
            exit 1
          fi
          echo ">>> Décompression de $ZIP_FILE dans prime-src/"
          mkdir -p prime-src
          unzip -o "$ZIP_FILE" -d prime-src

          echo "=== Contenu de prime-src ==="
          ls -la prime-src

          if [ ! -f prime-src/package.json ]; then
            echo "ERREUR : package.json introuvable dans le zip extrait."
            find prime-src -maxdepth 2 -type f
            exit 1
          fi

      - name: Installer les dépendances et builder le web app
        working-directory: prime-src
        run: |
          set -euo pipefail

          npm install

          # @capacitor/* ne sont pas dans package.json (installation Android
          # optionnelle, cf. README) — on les ajoute ici pour le build CI.
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

          npm run build

          echo "=== Contenu après build ==="
          ls -la

          if [ ! -d dist ]; then
            echo "ERREUR : dist/ introuvable après 'npm run build'."
            echo "Ce projet utilise le preset Nitro 'vercel' (voir vite.config.ts) :"
            echo "si la sortie va dans .vercel/output au lieu de dist/, Capacitor"
            echo "ne trouvera pas les assets statiques attendus (capacitor.config.ts: webDir='dist')."
            find . -maxdepth 2 -type d
            exit 1
          fi

      - name: Générer / synchroniser le projet Android natif
        working-directory: prime-src
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo ">>> Aucun dossier android/ — création via Capacitor"
            npx cap add android
          else
            echo ">>> Dossier android/ existant — synchronisation"
            npx cap sync android
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERREUR : android/gradlew manquant après 'cap add android'."
            find android -maxdepth 2 -type f 2>/dev/null || true
            exit 1
          fi

          ls -la android

      - name: Compiler l'APK release
        working-directory: prime-src/android
        run: |
          set -euo pipefail

          # Gradle properties minimales
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

          # Désactiver minify (évite les échecs liés à ProGuard/R8 sans règles ajustées)
          for f in $(find . \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) 2>/dev/null); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f" || true
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f" || true
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f" || true
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f" || true
          done

          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Alignement et Signature de l'APK (vrai Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*" -name "*.apk" | head -n 1 || true)
          if [ -z "${UNSIGNED_APK:-}" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK trouvé."
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK trouvé : $UNSIGNED_APK"

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERREUR : secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD manquants."
            echo "Ajoutez-les dans Settings > Secrets and variables > Actions du dépôt."
            exit 1
          fi

          # Reconstitue le vrai fichier .jks à partir du secret encodé en base64
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

          # Résoudre le SDK Android
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "$HOME/Android/Sdk" ]; then
            SDK="$HOME/Android/Sdk"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            ZIPALIGN_PATH=$(find /usr -name zipalign 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIPALIGN_PATH" ]; then
              SDK=$(dirname "$(dirname "$(dirname "$ZIPALIGN_PATH")")")
            else
              echo "ERREUR : SDK Android introuvable"
              exit 1
            fi
          fi

          echo "SDK=$SDK"
          BUILD_TOOLS_DIR=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -z "${BUILD_TOOLS_DIR:-}" ] || [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "ERREUR : build-tools introuvable sous $SDK"
            ls -la "$SDK" 2>/dev/null || true
            find /usr -name zipalign 2>/dev/null | head -10 || true
            exit 1
          fi

          echo "Build-tools : $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out Prime-release-signed.apk \
            app-aligned.apk

          # Nettoyage : ne jamais laisser le keystore réel sur le runner
          rm -f release.jks

          ls -la Prime-release-signed.apk

      - name: Publication sur GitHub Releases
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Prime ${{ github.run_number }}
          body: |
            APK release signé automatiquement (Prime — app cuisine, Android natif).
            ATTENTION : désinstallez l'ancienne version avant d'installer celle-ci si la signature a changé.
          files: Prime-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lien de téléchargement
        run: |
          echo "## 📦 APK disponible" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Page de la release :** ${{ steps.publish_release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Téléchargement direct de l'APK :**" >> "$GITHUB_STEP_SUMMARY"
          for asset_url in $(echo '${{ steps.publish_release.outputs.assets }}' | grep -o '"browser_download_url":"[^"]*"' | cut -d'"' -f4); do
            echo "- $asset_url" >> "$GITHUB_STEP_SUMMARY"
          done
