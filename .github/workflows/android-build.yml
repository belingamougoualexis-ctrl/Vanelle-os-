name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. ANDROID NDK
      # ============================================================
      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;29.0.14206865"

      # ============================================================
      # 6. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        run: |
          npm install

      # ============================================================
      # 7. PREPARE ANDROID
      # ============================================================
      - name: Prepare Android project
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

          find android -name "*.gradle" -o -name "*.gradle.kts" | sort

      # ============================================================
      # 8. PREPARE BUNDLED MODELS
      # ============================================================
      - name: Prepare bundled models
        run: |
          if [ -f scripts/prepare-bundled-models.sh ]; then
            chmod +x scripts/prepare-bundled-models.sh
            ./scripts/prepare-bundled-models.sh
          else
            echo "No bundled model preparation script found."
          fi

      # ============================================================
      # 9. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 10. FIND GENERATED APK
      # ============================================================
      - name: Locate Release APK
        run: |
          set -e

          APK_COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one release APK."
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" -print
            exit 1
          fi

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | head -n 1)

          echo "APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 11. GENERATE SIGNING KEY
      # ============================================================
      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore autogenerated.jks \
            -alias vanelle \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass vanelle123 \
            -keypass vanelle123 \
            -dname "CN=Vanelle, OU=Mobile, O=Vanelle, L=Douala, ST=Littoral, C=CM"

      # ============================================================
      # 12. ZIPALIGN
      # ============================================================
      - name: Zipalign APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -P 16 \
            -f \
            4 \
            "$APK" \
            VanelleOS-release-aligned.apk

      # ============================================================
      # 13. SIGN APK
      # ============================================================
      - name: Sign APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks autogenerated.jks \
            --ks-pass pass:vanelle123 \
            --key-pass pass:vanelle123 \
            --out VanelleOS-release-signed.apk \
            VanelleOS-release-aligned.apk

      # ============================================================
      # 14. VERIFY SIGNATURE
      # ============================================================
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            VanelleOS-release-signed.apk

      # ============================================================
      # 15. VERIFY 16 KB ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            VanelleOS-release-signed.apk

      # ============================================================
      # 16. TEST COMPLETE APP ON CLEAN ANDROID EMULATOR
      # ============================================================
      - name: Test automatique de l'application sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
          disable-animations: true

          script: |
            chmod +x scripts/android-smoke-test.sh

            ./scripts/android-smoke-test.sh \
              "$GITHUB_WORKSPACE/VanelleOS-release-signed.apk" \
              "$GITHUB_WORKSPACE/android-test-results"

      # ============================================================
      # 17. UPLOAD TEST RESULTS EVEN IF TEST FAILS
      # ============================================================
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android-test-results/
          if-no-files-found: ignore

      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-release-signed
          path: VanelleOS-release-signed.apk
          if-no-files-found: error

      # ============================================================
      # 19. CREATE GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VanelleOS v${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            VanelleOS-release-signed.apk

      # ============================================================
      # 20. FINAL STATUS
      # ============================================================
      - name: Final verification
        if: always()
        run: |
          echo "=================================================="
          echo "VANELLE BUILD / SIGN / TEST SUMMARY"
          echo "=================================================="

          if [ -f VanelleOS-release-signed.apk ]; then
            echo "APK: OK"
            ls -lh VanelleOS-release-signed.apk
          else
            echo "APK: NOT FOUND"
          fi

          if [ -d android-test-results ]; then
            echo "Android tests: RESULTS AVAILABLE"
            find android-test-results -maxdepth 2 -type f -print
          else
            echo "Android tests: NO RESULTS DIRECTORY"
          fi

          echo "=================================================="
