name: Build VanelleOS APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Trouver le projet Gradle
        id: gradle_project
        shell: bash
        run: |
          echo "Recherche de settings.gradle.kts..."

          GRADLE_DIR=$(find "$GITHUB_WORKSPACE" \
            -name "settings.gradle.kts" \
            -not -path "*/.gradle/*" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$GRADLE_DIR" ]; then
            echo "ERREUR : settings.gradle.kts introuvable."
            echo "Contenu du workspace :"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Projet Gradle trouvé dans : $GRADLE_DIR"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Vérifier le projet
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          echo "Répertoire Gradle :"
          pwd

          echo ""
          echo "Fichiers :"
          ls -la

          echo ""
          echo "Settings Gradle :"
          cat settings.gradle.kts

      - name: Compiler VanelleOS
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Vérifier l'APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          echo "Recherche de l'APK..."

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERREUR : APK non trouvé."
            find app/build -type f 2>/dev/null | sort || true
            exit 1
          fi

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-debug-apk
          path: ${{ steps.gradle_project.outputs.gradle_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
