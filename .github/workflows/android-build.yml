name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          ZIP_FILES=$(find . -maxdepth 3 -name "*.zip" 2>/dev/null || true)
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "\( file" -d " \)(dirname "$file")" || true
            done
          fi
          echo "=== Recherche projet Android ==="
          find . -name "settings.gradle*" -o -name "gradlew" 2>/dev/null | head -30

      - name: Correctifs Gradle (AndroidX + désactiver R8 minify)
        run: |
          for gp in $(find . -name "gradle.properties" 2>/dev/null); do
            grep -q "android.useAndroidX" "$gp" || echo "android.useAndroidX=true" >> "$gp"
            grep -q "android.enableJetifier" "$gp" || echo "android.enableJetifier=true" >> "$gp"
          done
          for f in $(find . \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) 2>/dev/null); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f" || true
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f" || true
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f" || true
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f" || true
          done

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilation de l'APK (release)
        run: |
          set -euo pipefail

          GRADLE_FILE=$(find . \( -name "settings.gradle.kts" -o -name "settings.gradle" \) 2>/dev/null \
            | grep -v node_modules | head -n 1 || true)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun settings.gradle trouvé."
            ls -la
            find . -maxdepth 4 -type d | head -40
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          echo "ANDROID_DIR=$ANDROID_DIR"
          cd "$ANDROID_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERREUR : gradlew introuvable dans $ANDROID_DIR"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Génération automatique du Keystore
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Vanelle, L=City, S=State, C=CI"

      - name: Alignement et Signature de l'APK
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*" -name "*.apk" ! -name "*-unsigned.apk" | head -n 1 || true)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find . -path "*/outputs/apk/*" -name "*.apk" | head -n 1 || true)
          fi

          if [ -z "${UNSIGNED_APK:-}" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK trouvé."
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "APK trouvé : $UNSIGNED_APK"
          SDK="\( {ANDROID_HOME:- \){ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK"/build-tools/* | tail -n 1)
          echo "Build-tools : $BUILD_TOOLS_DIR"

          "${BUILD_TOOLS_DIR}/zipalign" -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleRelance-release-signed.apk app-aligned.apk

          ls -la VanelleRelance-release-signed.apk

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle Relance ${{ github.run_number }}
          body: |
            APK release signé automatiquement (Vanelle Relance — Android natif).
            ATTENTION : désinstallez l'ancienne version avant d'installer celle-ci si la signature a changé.
          files: VanelleRelance-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanelleRelance-release-signed-${{ github.run_number }}
          path: VanelleRelance-release-signed.apk
          retention-days: 30
