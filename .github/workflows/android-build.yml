name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configuration Android SDK
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          set -o pipefail

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extraire le projet NEXUS + compiler l APK release
        run: |
          set -euo pipefail

          echo "=== Extraction des archives du projet ==="

          find . -maxdepth 2 -type f -name "*.zip" -exec unzip -o {} \; || true

          echo "=== Vérification du projet Android ==="

          if [ ! -f "nexus-android/settings.gradle.kts" ]; then
            echo "ERREUR : nexus-android/settings.gradle.kts introuvable."
            find . -maxdepth 4 -type f \
              \( -name "settings.gradle*" -o -name "build.gradle*" \) \
              -print || true
            exit 1
          fi

          if [ ! -f "nexus-android/app/build.gradle.kts" ]; then
            echo "ERREUR : nexus-android/app/build.gradle.kts introuvable."
            exit 1
          fi

          echo "Projet Android NEXUS détecté."

          cd nexus-android

          echo "=== Installation de Gradle ==="

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --version
            ./gradlew --no-daemon --stacktrace assembleRelease

          else
            echo "gradlew absent : utilisation de Gradle système."

            sudo apt-get update
            sudo apt-get install -y gradle

            gradle --version
            gradle --no-daemon --stacktrace assembleRelease
          fi

          echo "=== Recherche de l APK release ==="

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*unsigned*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1)"
          fi

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK release généré."

            find app/build/outputs -type f -print || true

            exit 1
          fi

          echo "APK trouvé : $APK"

          cp "$APK" ../NEXUS-release-unsigned.apk

          ls -lh ../NEXUS-release-unsigned.apk

      # Signature RÉELLE avec le keystore du propriétaire
      # KEYSTORE_BASE64 = fichier .jks / .keystore encodé en base64
      # KEYSTORE_PASSWORD = mot de passe du keystore
      # KEY_ALIAS = alias de la clé
      # KEY_PASSWORD = mot de passe de la clé

      - name: Alignement et vraie signature APK (keystore propriétaire)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          echo "=== Signature RÉELLE avec le keystore du propriétaire ==="

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then

            echo "ERREUR : secrets de signature manquants."
            echo "Ajoutez KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS et KEY_PASSWORD"
            echo "dans Settings > Secrets and variables > Actions."

            exit 1
          fi

          echo "=== Décodage du keystore ==="

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.jks"

          if [ ! -s "$RUNNER_TEMP/nexus-release.jks" ]; then
            echo "ERREUR : keystore vide ou invalide."
            exit 1
          fi

          echo "=== Recherche de zipalign et apksigner ==="

          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name "zipalign" \
            | sort -V \
            | tail -n 1)"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)"

          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "ERREUR : zipalign ou apksigner introuvable."
            exit 1
          fi

          echo "zipalign : $ZIPALIGN"
          echo "apksigner : $APKSIGNER"

          echo "=== Alignement APK ==="

          "$ZIPALIGN" \
            -f \
            -p 4 \
            NEXUS-release-unsigned.apk \
            NEXUS-release-aligned.apk

          echo "=== Signature APK ==="

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/nexus-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out NEXUS-release-signed.apk \
            NEXUS-release-aligned.apk

          echo "=== Vérification cryptographique ==="

          "$APKSIGNER" verify \
            --verbose \
            NEXUS-release-signed.apk

          echo "=== APK signé avec succès ==="

          ls -lh NEXUS-release-signed.apk

          rm -f NEXUS-release-unsigned.apk
          rm -f NEXUS-release-aligned.apk

      - name: Publication sur GitHub Releases
        id: publish_release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: v${{ github.run_number }}
          name: NEXUS ${{ github.run_number }}

          body: |
            APK NEXUS signé avec le keystore propriétaire
            (vraie signature release).

            Désinstallez l'ancienne version avant d'installer
            si la signature a changé.

          files: NEXUS-release-signed.apk
          draft: false
          prerelease: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lien de telechargement
        run: |
          echo "## NEXUS - APK signé (keystore propriétaire)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Signature : vraie clé release (secrets KEYSTORE_* du dépôt)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Page de la release : ${{ steps.publish_release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
