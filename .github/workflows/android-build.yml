name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip archives if present
        run: |
          ZIP_FILE=$(find . -name "*.zip" -not -path "*/.*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE. Décompression..."
            unzip -o "$ZIP_FILE" -d ./extracted_project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Root Android Directory
        run: |
          echo "=== Recherche du répertoire racine Android ==="
          SETTINGS_PATH=$(find . -name "settings.gradle*" -not -path "*/.*" | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "settings.gradle non trouvé, recherche du build.gradle racine..."
            SETTINGS_PATH=$(find . -name "build.gradle*" -not -path "*/.*" | awk '{ print length, $0 }' | sort -n | cut -d" " -f2- | head -n 1)
          fi

          if [ -z "$SETTINGS_PATH" ]; then
            echo "::error::Aucun fichier de configuration Gradle trouvé !"
            exit 1
          fi

          REAL_ROOT=$(cd $(dirname "$SETTINGS_PATH") && pwd)
          echo "Racine Android détectée : $REAL_ROOT"
          echo "PROJECT_DIR=$REAL_ROOT" >> $GITHUB_ENV

      - name: Fetch or Create Permanent Keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          KEYSTORE_FETCHED=false
          if git fetch origin keystore-store:refs/remotes/origin/keystore-store 2>/dev/null; then
            echo "Branche distante trouvée ! Extraction du keystore..."
            if git checkout refs/remotes/origin/keystore-store -- release.keystore 2>/dev/null; then
              echo "Clé release.keystore récupérée avec succès !"
              KEYSTORE_FETCHED=true
            fi
          fi

          if [ "$KEYSTORE_FETCHED" = false ]; then
            echo "Génération d'une nouvelle clé PERMANENTE..."
            keytool -genkeypair -v -keystore release.keystore \
              -alias vanellekey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "VanellePermanentPass123!" -keypass "VanellePermanentPass123!" \
              -dname "CN=Vanelle, OU=App, O=Vanelle, L=City, ST=State, C=FR"
            
            CURRENT_BRANCH=${{ github.ref_name }}
            cp release.keystore /tmp/release.keystore
            git branch -D keystore-store 2>/dev/null || true
            
            git checkout --orphan keystore-store
            git reset --hard
            git clean -fdx
            
            cp /tmp/release.keystore release.keystore
            git add release.keystore
            git commit -m "Save permanent release keystore"
            git push origin keystore-store --force
            
            git checkout $CURRENT_BRANCH
          fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Upgrade Wrapper to Gradle 8.11.1
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK with Detailed Kotlin Logs
        run: ./gradlew assembleDebug --stacktrace --info
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
