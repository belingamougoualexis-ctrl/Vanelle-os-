name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraire le projet + compiler l'APK release
        run: |
          set -euo pipefail

          echo "=== Contenu du dépôt ==="
          ls -la

          find . -maxdepth 2 -type f -name "*.zip" | while read -r z; do
            echo ">>> Décompression de $z"
            unzip -o "$z"
          done

          echo "=== Après décompression ==="
          ls -la
          find . -name "settings.gradle*" -o -name "gradlew" | head -20

          if [ -f "./VanelleRelance/settings.gradle.kts" ]; then
            ANDROID_DIR="./VanelleRelance"
          elif [ -f "./settings.gradle.kts" ]; then
            ANDROID_DIR="."
          else
            GRADLE_FILE=$(find . \( -name "settings.gradle.kts" -o -name "settings.gradle" \) 2>/dev/null \
              | grep -v node_modules | head -n 1 || true)
            if [ -z "$GRADLE_FILE" ]; then
              echo "ERREUR : Aucun settings.gradle trouvé après extraction."
              find . -maxdepth 5 -type f | head -50
              exit 1
            fi
            ANDROID_DIR=$(dirname "$GRADLE_FILE")
          fi

          echo "ANDROID_DIR=$ANDROID_DIR"
          cd "$ANDROID_DIR"
          ls -la

          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

          for f in $(find . \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) 2>/dev/null); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f" || true
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f" || true
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f" || true
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f" || true
          done

          if [ ! -f "./gradlew" ]; then
            echo "ERREUR : gradlew manquant dans $ANDROID_DIR"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Alignement et Signature de l'APK
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*" -name "*.apk" | head -n 1 || true)
          if [ -z "${UNSIGNED_APK:-}" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK trouvé."
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK trouvé : $UNSIGNED_APK"

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "$HOME/Android/Sdk" ]; then
            SDK="$HOME/Android/Sdk"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            ZIPALIGN_PATH=$(find /usr -name zipalign 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIPALIGN_PATH" ]; then
              SDK=\( (dirname " \)(dirname "$(dirname "$ZIPALIGN_PATH")")")
            else
              echo "ERREUR : SDK Android introuvable"
              exit 1
            fi
          fi

          echo "SDK=$SDK"
          BUILD_TOOLS_DIR=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -z "${BUILD_TOOLS_DIR:-}" ] || [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "ERREUR : build-tools introuvable sous $SDK"
            ls -la "$SDK" 2>/dev/null || true
            find /usr -name zipalign 2>/dev/null | head -10 || true
            exit 1
          fi

          echo "Build-tools : $BUILD_TOOLS_DIR"

          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Vanelle, L=City, S=State, C=CI"

          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleRelance-release-signed.apk \
            app-aligned.apk

          ls -la VanelleRelance-release-signed.apk

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle Relance ${{ github.run_number }}
          body: |
            APK release signé automatiquement (Vanelle Relance — Android natif).
            ATTENTION : désinstallez l'ancienne version avant d'installer celle-ci si la signature a changé.
          files: VanelleRelance-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanelleRelance-release-signed-${{ github.run_number }}
          path: VanelleRelance-release-signed.apk
          retention-days: 30
