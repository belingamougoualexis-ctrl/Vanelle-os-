name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi

      - name: Correctif automatique du code Kotlin (val -> var)
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          python3 -c '
          import re, os

          file_path = "app/src/main/java/com/vanelle/os/Fragments.kt"
          if os.path.exists(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              # Recherche des réaffectations de variables et conversion de leur déclaration val -> var
              content = "".join(lines)
              val_vars = set(re.findall(r"\bval\s+([a-zA-Z0-9_]+)\b", content))
              
              for var_name in val_vars:
                  # Si la variable est réaffectée plus loin (ex: var_name = ...)
                  if re.search(r"\b" + var_name + r"\s*=\s*", content[content.find("val " + var_name) + len(var_name):]):
                      content = re.sub(r"\bval\s+" + var_name + r"\b", f"var {var_name}", content)

              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Correction dynamique appliquée à Fragments.kt")
          '

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilation de l'APK
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun fichier Gradle trouvé."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Génération du Keystore de signature
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -path "*/outputs/apk/*" -name "*.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK trouvé."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | tail -n 1)

          ${BUILD_TOOLS_DIR}/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk app-aligned.apk

      - name: Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Release-APK
          path: VanelleOS-release-signed.apk
          if-no-files-found: error
