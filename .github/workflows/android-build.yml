name: Build and Sign Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Récupération du dépôt
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Vérification de la structure du projet
      # ============================================================
      - name: Vérifier la racine React Native
        run: |
          set -euo pipefail

          echo "Répertoire courant :"
          pwd

          echo ""
          echo "Contenu du dépôt :"
          ls -la

          if [ ! -f "package.json" ]; then
            echo "ERREUR : package.json doit être à la racine du dépôt."
            echo ""
            echo "package.json trouvés :"
            find . -maxdepth 4 -type f -name package.json -print
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "ERREUR : dossier android/ introuvable à la racine."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ]; then
            echo "ERREUR : android/settings.gradle introuvable."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERREUR : android/gradlew introuvable."
            exit 1
          fi

          if [ ! -f "package.json" ]; then
            echo "ERREUR : package.json introuvable."
            exit 1
          fi

          echo ""
          echo "Structure correcte."

          echo ""
          echo "package.json :"
          cat package.json

          echo ""
          echo "settings.gradle :"
          cat android/settings.gradle

      # ============================================================
      # 3. Node.js
      # ============================================================
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
          cache-dependency-path: package.json

      # ============================================================
      # 4. Java 17
      # ============================================================
      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. Android SDK
      # ============================================================
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. Vérification des versions
      # ============================================================
      - name: Vérifier Node / npm / Java
        run: |
          set -euo pipefail

          echo "Node :"
          node --version

          echo "npm :"
          npm --version

          echo "Java :"
          java -version

      # ============================================================
      # 7. Installation des dépendances React Native
      #
      # IMPORTANT :
      # Cette étape est exécutée AVANT Gradle.
      # Elle crée :
      # node_modules/@react-native/gradle-plugin
      # ============================================================
      - name: Installer les dépendances npm
        run: |
          set -euo pipefail

          echo "Installation npm depuis :"
          pwd

          npm install \
            --include=dev \
            --no-audit \
            --no-fund

          echo ""
          echo "Vérification de React Native..."

          test -d node_modules/react-native
          test -f node_modules/react-native/package.json

          echo "React Native trouvé."

          echo ""
          echo "Vérification du React Native Gradle Plugin..."

          test -d node_modules/@react-native/gradle-plugin
          test -f node_modules/@react-native/gradle-plugin/package.json

          echo "React Native Gradle Plugin trouvé :"
          realpath node_modules/@react-native/gradle-plugin

          echo ""
          echo "Version du plugin :"
          node -p "require('./node_modules/@react-native/gradle-plugin/package.json').version"

      # ============================================================
      # 8. Vérification explicite du package React Native
      # ============================================================
      - name: Vérifier les versions React Native
        run: |
          set -euo pipefail

          RN_VERSION=$(node -p "require('./node_modules/react-native/package.json').version")
          PLUGIN_VERSION=$(node -p "require('./node_modules/@react-native/gradle-plugin/package.json').version")

          echo "React Native       : $RN_VERSION"
          echo "Gradle Plugin RN   : $PLUGIN_VERSION"

          if [ "$RN_VERSION" != "0.87.0" ]; then
            echo "ERREUR : React Native attendu = 0.87.0"
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "0.87.0" ]; then
            echo "ERREUR : @react-native/gradle-plugin attendu = 0.87.0"
            exit 1
          fi

          echo "Versions compatibles."

      # ============================================================
      # 9. Vérification du settings.gradle
      # ============================================================
      - name: Vérifier settings.gradle
        run: |
          set -euo pipefail

          SETTINGS="android/settings.gradle"

          echo "Contenu de $SETTINGS :"
          cat "$SETTINGS"

          grep -q '@react-native/gradle-plugin' "$SETTINGS"

          echo ""
          echo "Répertoire plugin :"
          realpath node_modules/@react-native/gradle-plugin

      # ============================================================
      # 10. Configuration Gradle
      # ============================================================
      - name: Préparer Gradle
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Gradle wrapper :"
          ./gradlew --version

      # ============================================================
      # 11. Vérification AndroidX
      # ============================================================
      - name: Vérifier gradle.properties
        run: |
          set -euo pipefail

          if [ ! -f "android/gradle.properties" ]; then
            touch android/gradle.properties
          fi

          grep -q '^android.useAndroidX=true' android/gradle.properties || \
            echo 'android.useAndroidX=true' >> android/gradle.properties

          grep -q '^android.enableJetifier=true' android/gradle.properties || \
            echo 'android.enableJetifier=true' >> android/gradle.properties

          echo "gradle.properties :"
          cat android/gradle.properties

      # ============================================================
      # 12. Préparation des modèles GGUF
      #
      # Les modèles sont téléchargés pendant le BUILD.
      # Ils sont ensuite intégrés dans l'application.
      # ============================================================
      - name: Préparer les modèles GGUF
        run: |
          set -euo pipefail

          if [ -f "scripts/prepare-bundled-models.sh" ]; then

            chmod +x scripts/prepare-bundled-models.sh

            ./scripts/prepare-bundled-models.sh

            echo ""
            echo "Modèles présents :"

            find android/app/src/main/assets/models \
              -maxdepth 1 \
              -type f \
              -name "*.gguf" \
              -exec ls -lh {} \;

          else
            echo "ERREUR : scripts/prepare-bundled-models.sh introuvable."
            exit 1
          fi

      # ============================================================
      # 13. Vérification finale avant Gradle
      # ============================================================
      - name: Audit avant compilation
        run: |
          set -euo pipefail

          echo "===== AUDIT PROJET ====="

          test -f package.json
          test -d node_modules
          test -d node_modules/react-native
          test -d node_modules/@react-native/gradle-plugin

          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo ""
          echo "Racine :"
          pwd

          echo ""
          echo "React Native Gradle Plugin :"
          realpath node_modules/@react-native/gradle-plugin

          echo ""
          echo "Gradle settings :"
          realpath android/settings.gradle

          echo ""
          echo "APK assets :"
          find android/app/src/main/assets -maxdepth 2 -type f 2>/dev/null || true

          echo ""
          echo "===== AUDIT OK ====="

      # ============================================================
      # 14. Nettoyage Gradle
      # ============================================================
      - name: Nettoyer Gradle
        working-directory: android
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon --stacktrace

      # ============================================================
      # 15. Compilation Release
      # ============================================================
      - name: Compiler APK Release
        working-directory: android
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 16. Vérifier l'APK
      # ============================================================
      - name: Vérifier APK généré
        run: |
          set -euo pipefail

          echo "APK générés :"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "ERREUR : aucun APK release trouvé."
            exit 1
          fi

          echo ""
          echo "APK trouvé : $APK"
          ls -lh "$APK"

      # ============================================================
      # 17. Générer le keystore
      # ============================================================
      - name: Générer le keystore
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=Vanelle OS, OU=Build, O=Vanelle, L=Yaounde, S=Centre, C=CM"

      # ============================================================
      # 18. Alignement APK
      # ============================================================
      - name: Aligner APK
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "${ANDROID_SDK_ROOT}/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          echo "Build Tools : $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -v \
            -p 4 \
            "$APK" \
            app-aligned.apk

      # ============================================================
      # 19. Signature APK
      # ============================================================
      - name: Signer APK
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR=$(find "${ANDROID_SDK_ROOT}/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk \
            app-aligned.apk

          echo ""
          echo "APK signé :"
          ls -lh VanelleOS-release-signed.apk

      # ============================================================
      # 20. Vérifier la signature
      # ============================================================
      - name: Vérifier signature APK
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR=$(find "${ANDROID_SDK_ROOT}/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            VanelleOS-release-signed.apk

          echo "Signature APK valide."

      # ============================================================
      # 21. Calcul SHA-256
      # ============================================================
      - name: Calculer SHA-256
        run: |
          set -euo pipefail

          sha256sum VanelleOS-release-signed.apk \
            | tee VanelleOS-release-signed.apk.sha256

      # ============================================================
      # 22. Publication GitHub Release
      # ============================================================
      - name: Publier GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle OS ${{ github.run_number }}
          body: |
            Vanelle OS — APK Release

            APK compilé et signé automatiquement par GitHub Actions.

            Les modèles GGUF sont préparés pendant le build et intégrés
            à l'application.

            SHA-256 disponible dans le fichier .sha256.
          files: |
            VanelleOS-release-signed.apk
            VanelleOS-release-signed.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 23. Résumé GitHub Actions
      # ============================================================
      - name: Afficher le résultat
        run: |
          echo "## ✅ Vanelle OS — Build réussi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "VanelleOS-release-signed.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat VanelleOS-release-signed.apk.sha256 >> "$GITHUB_STEP_SUMMARY"
