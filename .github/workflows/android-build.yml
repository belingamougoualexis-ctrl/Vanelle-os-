name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Décompression du ZIP
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE. Décompression..."
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Correction automatique des erreurs Kotlin
      - name: Corriger le code Kotlin
        run: |
          WAKE_FILE=$(find . -name "WakeWordService.kt" | head -n 1)
          if [ -n "$WAKE_FILE" ]; then
            echo "Correction dans : $WAKE_FILE"
            sed -i '1s/^/import android.os.Bundle\n/' "$WAKE_FILE"
          fi

          CONTACTS_FILE=$(find . -name "ContactsRepository.kt" | head -n 1)
          if [ -n "$CONTACTS_FILE" ]; then
            echo "Correction dans : $CONTACTS_FILE"
            sed -i 's/\\%/%/g' "$CONTACTS_FILE"
            sed -i 's/\\_/_/g' "$CONTACTS_FILE"
          fi

      # 3. Compilation ET copie de l'APK dans la même étape
      - name: Compiler avec Gradle et extraire l'APK
        working-directory: dossier_decompresse
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          # Création d'un dossier d'export à la racine globale
          mkdir -p ../output_apk
          
          echo "Recherche et copie des fichiers APK..."
          find . -name "*.apk" -exec cp -v {} ../output_apk/ \;
          
          echo "--- Fichiers présent dans output_apk ---"
          ls -la ../output_apk/

      # 4. Téléversement de l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
