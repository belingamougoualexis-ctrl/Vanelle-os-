name: Build and Test VanelleOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build APK de test
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Récupération du projet
      # ---------------------------------------------------------
      - name: Récupération du code source
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Décompression éventuelle d'une archive du projet
      # ---------------------------------------------------------
      - name: Décompression des archives ZIP du projet
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche d'une archive Android..."

          ZIP_FILE=""

          while IFS= read -r file; do
            if unzip -l "$file" | grep -qE '(^|/)android/settings\.gradle(\.kts)?$'; then
              ZIP_FILE="$file"
              break
            fi
          done < <(find . -maxdepth 3 -type f -name "*.zip")

          if [ -n "$ZIP_FILE" ]; then
            echo "Archive Android trouvée : $ZIP_FILE"

            mkdir -p extracted-project
            unzip -o "$ZIP_FILE" -d extracted-project

            echo "Contenu extrait :"
            find extracted-project -maxdepth 3 -type f \
              \( -name "package.json" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
          else
            echo "Aucune archive Android détectée."
            echo "Le projet doit donc déjà être présent dans le dépôt."
          fi

      # ---------------------------------------------------------
      # 3. Détection automatique de la racine React Native
      # ---------------------------------------------------------
      - name: Détection du projet React Native
        shell: bash
        run: |
          set -euo pipefail

          RN_ROOT=""

          # Projet directement à la racine
          if [ -f "package.json" ] && [ -d "android" ]; then
            RN_ROOT="$(pwd)"
          fi

          # Projet extrait d'une archive
          if [ -z "$RN_ROOT" ]; then
            CANDIDATE=$(find . -type f -name "package.json" \
              -not -path "*/node_modules/*" \
              -not -path "*/.git/*" \
              -print0 | while IFS= read -r -d '' file; do
                dir="$(dirname "$file")"

                if [ -d "$dir/android" ]; then
                  echo "$dir"
                  break
                fi
              done)

            if [ -n "$CANDIDATE" ]; then
              RN_ROOT="$(cd "$CANDIDATE" && pwd)"
            fi
          fi

          if [ -z "$RN_ROOT" ]; then
            echo "ERREUR : impossible de trouver la racine React Native."
            echo ""
            echo "Structure attendue :"
            echo "  package.json"
            echo "  android/"
            echo ""
            find . -maxdepth 4 -type f \
              \( -name "package.json" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
            exit 1
          fi

          ANDROID_DIR="$RN_ROOT/android"

          echo "RN_ROOT=$RN_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projet React Native : $RN_ROOT"
          echo "Projet Android      : $ANDROID_DIR"

          test -f "$RN_ROOT/package.json"
          test -d "$ANDROID_DIR"

      # ---------------------------------------------------------
      # 4. Node.js
      # ---------------------------------------------------------
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: ${{ env.RN_ROOT }}/package-lock.json

      # ---------------------------------------------------------
      # 5. Java 17
      # ---------------------------------------------------------
      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 6. Android SDK
      # ---------------------------------------------------------
      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 7. Vérification AndroidX / Gradle
      # ---------------------------------------------------------
      - name: Vérification de la configuration Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          echo "=== gradle.properties ==="

          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          cat gradle.properties

          echo ""
          echo "=== Gradle wrapper ==="

          test -f gradlew
          chmod +x gradlew

          test -f gradle/wrapper/gradle-wrapper.properties

          grep "distributionUrl" \
            gradle/wrapper/gradle-wrapper.properties || true

      # ---------------------------------------------------------
      # 8. Installation des dépendances JavaScript
      # ---------------------------------------------------------
      - name: Installation des dépendances npm
        shell: bash
        run: |
          set -euo pipefail

          cd "$RN_ROOT"

          if [ -f package-lock.json ]; then
            npm ci --include=dev --no-audit --no-fund
          else
            npm install --include=dev --no-audit --no-fund
          fi

          echo ""
          echo "React Native Gradle Plugin :"

          test -d node_modules/@react-native/gradle-plugin

          echo "OK"

      # ---------------------------------------------------------
      # 9. Vérification de la partie native Vanelle
      # ---------------------------------------------------------
      - name: Vérification du bridge natif Vanelle
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche des fichiers natifs..."

          find "$ANDROID_DIR/app/src/main" \
            -type f \
            \( \
              -name "*VanelleNative*" \
              -o -name "*EmbeddingEngine*" \
              -o -name "*EmbeddingHolder*" \
              -o -name "CMakeLists.txt" \
            \) \
            -print

          echo ""
          echo "Vérification des fichiers importants..."

          test -f "$ANDROID_DIR/app/src/main/cpp/CMakeLists.txt"
          test -f "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainApplication.kt"

          echo "Bridge natif : OK"

      # ---------------------------------------------------------
      # 10. Préparation des modèles embarqués
      # ---------------------------------------------------------
      - name: Préparation des modèles embarqués
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RN_ROOT/scripts/prepare-bundled-models.sh"

          if [ -f "$SCRIPT" ]; then
            echo "Script trouvé : $SCRIPT"

            chmod +x "$SCRIPT"

            "$SCRIPT"
          else
            echo "Aucun script prepare-bundled-models.sh."
            echo "Cette étape est ignorée."
          fi

      # ---------------------------------------------------------
      # 11. Nettoyage Gradle
      # ---------------------------------------------------------
      - name: Nettoyage Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          chmod +x ./gradlew

          ./gradlew clean --no-daemon

      # ---------------------------------------------------------
      # 12. Compilation APK de test
      # ---------------------------------------------------------
      - name: Compilation de l'APK de test
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          chmod +x ./gradlew

          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # 13. Recherche de l'APK
      # ---------------------------------------------------------
      - name: Vérification de l'APK généré
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK généré."
            echo ""
            echo "APK trouvés :"
            find "$ANDROID_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK trouvé : $APK"

          mkdir -p "$RN_ROOT/test-output"

          cp "$APK" "$RN_ROOT/test-output/VanelleOS-test.apk"

          ls -lh "$RN_ROOT/test-output/VanelleOS-test.apk"

      # ---------------------------------------------------------
      # 14. Vérification SHA-256
      # ---------------------------------------------------------
      - name: Calcul du SHA-256
        shell: bash
        run: |
          set -euo pipefail

          cd "$RN_ROOT"

          sha256sum test-output/VanelleOS-test.apk \
            | tee test-output/VanelleOS-test.apk.sha256

      # ---------------------------------------------------------
      # 15. Publication comme Artifact GitHub
      # ---------------------------------------------------------
      - name: Upload APK de test
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-test-${{ github.run_number }}
          path: |
            ${{ env.RN_ROOT }}/test-output/VanelleOS-test.apk
            ${{ env.RN_ROOT }}/test-output/VanelleOS-test.apk.sha256
          retention-days: 14

      # ---------------------------------------------------------
      # 16. Résumé du build
      # ---------------------------------------------------------
      - name: Résumé du build
        shell: bash
        run: |
          echo "## ✅ VanelleOS — APK de test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build : #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK généré avec succès." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Artifact : VanelleOS-test-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🔐 Aucun keystore permanent requis pour ce test." >> "$GITHUB_STEP_SUMMARY"
