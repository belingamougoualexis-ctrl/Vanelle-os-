name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompresser l'archive ZIP
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration de JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Corrections profondes des fichiers Kotlin et Gradle
      - name: Appliquer les corrections Kotlin & Gradle
        run: |
          python3 - << 'EOF'
          import os, re

          # Recherche récursive de TOUS les fichiers dans le Workspace
          def find_all(name):
              result = []
              for root, dirs, files in os.walk("."):
                  if name in files:
                      result.append(os.path.join(root, name))
              return result

          # --- FIX 1: ContactsRepository.kt ---
          # Nettoyage brutal de tous les antislashs d'échappement invalides
          for path in find_all("ContactsRepository.kt"):
              print(f"Correction ContactsRepository: {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              new_lines = []
              for line in lines:
                  # Remplace les échappements inconnus comme \% ou \_ par leur caractère simple
                  line = re.sub(r'\\([^ntbr\'"\\$u])', r'\1', line)
                  new_lines.append(line)
              
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # --- FIX 2: Fragments.kt ---
          # Suppression des redéclarations "val" inutiles en les commentant ou renommant
          for path in find_all("Fragments.kt"):
              print(f"Correction Fragments.kt: {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # On résout le 'Conflicting declarations' en renommant les doublons locaux
              lines = content.split('\n')
              seen = {}
              new_lines = []
              scope_id = 0

              for line in lines:
                  if "fun " in line or "override" in line:
                      scope_id += 1
                  
                  match = re.search(r'\bval\s+(legalCol|privacyBtn|termsBtn)\b', line)
                  if match:
                      var_name = match.group(1)
                      key = f"{scope_id}_{var_name}"
                      if key in seen:
                          # Transforme 'val legalCol' en 'legalCol' (simple réaffectation)
                          line = re.sub(r'\bval\s+' + var_name, var_name, line, count=1)
                      else:
                          seen[key] = True
                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.write('\n'.join(new_lines))

          # --- FIX 3: MemoryVault.kt ---
          # Remplace le code cryptographique bancal par l'utilisation standard SharedPreferences
          for path in find_all("MemoryVault.kt"):
              print(f"Correction MemoryVault.kt: {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Nettoyage des imports MasterKey qui échouent
              content = re.sub(r'import androidx\.security\.crypto\..*\n', '', content)

              # Si EncryptedSharedPreferences pose problème, on bascule sur la création sécurisée standard Jetpack
              imports_to_add = (
                  "import androidx.security.crypto.MasterKey\n"
                  "import androidx.security.crypto.EncryptedSharedPreferences\n"
              )
              content = re.sub(r'(package\s+[^\n]+)', r'\1\n' + imports_to_add, content, count=1)

              # Correction du MasterKey.Builder et de la signature EncryptedSharedPreferences
              old_pattern = r'EncryptedSharedPreferences\.create\s*\([^)]+\)'
              new_code = (
                  'EncryptedSharedPreferences.create(\n'
                  '            context,\n'
                  '            "secret_vault",\n'
                  '            MasterKey.Builder(context).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),\n'
                  '            EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,\n'
                  '            EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM\n'
                  '        )'
              )
              content = re.sub(old_pattern, new_code, content, flags=re.DOTALL)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- FIX 4: Injection de la dépendance androidx.security ---
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file in ["build.gradle", "build.gradle.kts"]:
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          c = f.read()
                      if "dependencies" in c and "security-crypto" not in c:
                          print(f"Ajout dépendance dans : {path}")
                          dep = '\n    implementation "androidx.security:security-crypto:1.1.0-alpha06"\n'
                          c = re.sub(r'dependencies\s*\{', 'dependencies {' + dep, c, count=1)
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(c)
          EOF

      # 4. Compilation avec Gradle
      - name: Compiler avec Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi

          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew

          ./gradlew assembleDebug > gradle_build.log 2>&1 || BUILD_FAILED=true

          if [ "$BUILD_FAILED" = "true" ]; then
            echo "=================================================="
            echo "       ERREURS DE COMPILATION KOTLIN DETECTEES    "
            echo "=================================================="
            grep -E "e: file://|error:" gradle_build.log || tail -n 50 gradle_build.log
            echo "=================================================="
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Export de l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
