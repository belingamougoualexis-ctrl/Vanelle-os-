name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompresser le ZIP s'il existe
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration de JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Corrections ciblées des erreurs Kotlin & Ajout des dépendances
      - name: Corriger le code Kotlin et gradle
        run: |
          python3 - << 'EOF'
          import os, re, glob

          def find_files(pattern):
              return glob.glob(f"./**/{pattern}", recursive=True)

          # --- Fix 1: ContactsRepository.kt (Nettoyage sécurisé des séquences d'échappement invalides) ---
          for path in find_files("ContactsRepository.kt"):
              print(f"Nettoyage sécurisé dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # On cible uniquement \% et \_ explicites sans toucher aux appels de fonctions .replace()
              content = content.replace(r'\%', '%').replace(r'\_', '_')
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- Fix 2: Fragments.kt (Suppression globale des déclarations 'val' en doublon) ---
          for path in find_files("Fragments.kt"):
              print(f"Correction des doublons dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              new_lines = []
              target_vars = {"legalCol", "privacyBtn", "termsBtn"}
              seen_in_block = set()

              for line in lines:
                  # Réinitialiser les variables vues lors des ouvertures de blocs principaux
                  if any(k in line for k in ["fun ", "override fun", "class "]):
                      seen_in_block.clear()
                      
                  match = re.search(r"^\s*val\s+(legalCol|privacyBtn|termsBtn)\b", line)
                  if match:
                      var_name = match.group(1)
                      if var_name in seen_in_block:
                          # Supprime 'val ' pour éviter la redéclaration
                          line = line.replace("val " + var_name, var_name, 1)
                      else:
                          seen_in_block.add(var_name)
                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # --- Fix 3: MemoryVault.kt (Injection d'imports pour MasterKey) ---
          for path in find_files("MemoryVault.kt"):
              print(f"Ajout des imports MasterKey dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              imports = "\nimport androidx.security.crypto.MasterKey\nimport androidx.security.crypto.EncryptedSharedPreferences\n"
              if "androidx.security.crypto.MasterKey" not in content:
                  content = re.sub(r'(package\s+[^\n]+)', r'\1' + imports, content, count=1)
                  
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- Fix 4: Injection de androidx.security:security-crypto dans TOUS les build.gradle ---
          gradle_files = find_files("build.gradle") + find_files("build.gradle.kts")
          for path in gradle_files:
              print(f"Vérification dépendances Gradle dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              if "dependencies" in content and "security-crypto" not in content:
                  dep = '\n    implementation "androidx.security:security-crypto:1.1.0-alpha06"\n'
                  content = content.replace("dependencies {", "dependencies {" + dep, 1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
          EOF

      # 4. Compilation avec Gradle
      - name: Compiler avec Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi
          
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Dossier du projet : $DIR"
          cd "$DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Vérification
      - name: Vérifier la présence de l'APK
        run: |
          echo "Contenu du dossier d'exportation :"
          ls -la "$GITHUB_WORKSPACE/output_apk"

      # 6. Téléversement de l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
