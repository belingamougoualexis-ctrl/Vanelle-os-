name: Build and Sign Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Récupération du dépôt
      # ------------------------------------------------------------
      - name: Récupération du code source
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Vérification de la structure
      # ------------------------------------------------------------
      - name: Vérification du projet
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Racine du dépôt ==="
          pwd
          ls -la

          if [ ! -f "package.json" ]; then
            echo "::error::package.json introuvable à la racine du dépôt."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "::error::android/settings.gradle introuvable."
            echo "::error::Le dépôt GitHub doit contenir directement le dossier android/."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew introuvable."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Projet React Native/Android correctement détecté."

      # ------------------------------------------------------------
      # 3. Node.js
      # ------------------------------------------------------------
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      # ------------------------------------------------------------
      # 4. Java 17
      # ------------------------------------------------------------
      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 5. Android SDK
      # ------------------------------------------------------------
      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 6. Installation des dépendances
      # ------------------------------------------------------------
      - name: Installation des dépendances Node
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "package-lock.json" ]; then
            npm ci --include=dev --no-audit --no-fund
          else
            echo "::warning::package-lock.json absent."
            npm install --include=dev --no-audit --no-fund
          fi

      # ------------------------------------------------------------
      # 7. Préparation des modèles IA
      # ------------------------------------------------------------
      - name: Préparation des modèles IA embarqués
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "scripts/prepare-bundled-models.sh" ]; then
            chmod +x scripts/prepare-bundled-models.sh
            ./scripts/prepare-bundled-models.sh
          else
            echo "Aucun script de préparation des modèles IA."
          fi

      # ------------------------------------------------------------
      # 8. Vérification Gradle
      # ------------------------------------------------------------
      - name: Vérification Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version

      # ------------------------------------------------------------
      # 9. Compilation APK Release
      # ------------------------------------------------------------
      - name: Compilation APK Release
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 10. Recherche de l'APK
      # ------------------------------------------------------------
      - name: Recherche de l'APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="android/app/build/outputs/apk"

          APK=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -not -name "*unsigned*" \
            -print -quit 2>/dev/null || true)

          if [ -z "$APK" ]; then
            APK=$(find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print -quit 2>/dev/null || true)
          fi

          if [ -z "$APK" ]; then
            echo "::error::Aucun APK généré."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK trouvé : $APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 11. Génération du keystore temporaire
      # ------------------------------------------------------------
      - name: Génération du keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_PASSWORD n'est pas configuré."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/vanelle-release.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -alias releasekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Vanelle"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 12. Signature APK
      # ------------------------------------------------------------
      - name: Signature de l'APK
        id: sign
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          UNSIGNED_APK="${{ steps.apk.outputs.path }}"
          APK_DIR="$(dirname "$UNSIGNED_APK")"

          ALIGNED_APK="$RUNNER_TEMP/Vanelle-aligned.apk"
          SIGNED_APK="$APK_DIR/Vanelle-release-signed.apk"

          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android Build Tools introuvables."
            exit 1
          fi

          echo "Android Build Tools : $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias releasekey \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            "$SIGNED_APK"

          echo "APK signé : $SIGNED_APK"

          echo "path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 13. Upload de l'APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vanelle-release-apk
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 14. Création de la Release GitHub
      # ------------------------------------------------------------
      - name: Création de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle Release ${{ github.run_number }}
          body: |
            APK Release Vanelle généré et signé automatiquement.

            Build : ${{ github.run_number }}
            Commit : ${{ github.sha }}
          files: ${{ steps.sign.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
