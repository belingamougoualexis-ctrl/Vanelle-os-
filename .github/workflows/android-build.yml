name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Décompression du ZIP
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Application des corrections dans le code Kotlin
      - name: Corriger le code Kotlin
        run: |
          # Correction 1 : Import Bundle dans WakeWordService.kt
          WAKE_FILE=$(find . -name "WakeWordService.kt" | head -n 1)
          if [ -n "$WAKE_FILE" ]; then
            echo "Modification de $WAKE_FILE"
            sed -i '1s/^/import android.os.Bundle\n/' "$WAKE_FILE"
          fi

          # Correction 2 : Échappements dans ContactsRepository.kt
          CONTACTS_FILE=$(find . -name "ContactsRepository.kt" | head -n 1)
          if [ -n "$CONTACTS_FILE" ]; then
            echo "Modification de $CONTACTS_FILE"
            sed -i 's/\\%/%/g' "$CONTACTS_FILE"
            sed -i 's/\\_/_/g' "$CONTACTS_FILE"
          fi

      # 3. Lancement direct de Gradle et vérification du code de sortie
      - name: Compiler avec Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi
          
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Dossier du projet : $DIR"
          cd "$DIR"
          
          chmod +x gradlew
          
          # Lancement de la compilation
          ./gradlew assembleDebug --stacktrace
          
          # Vérification post-build
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 4. Afficher les fichiers récupérés
      - name: Vérifier la présence de l'APK
        run: |
          echo "Contenu du dossier d'exportation :"
          ls -la "$GITHUB_WORKSPACE/output_apk"

      # 5. Téléverser l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
