name: Build VanelleOS APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build VanelleOS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Grant execute permission (if wrapper present)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug --stacktrace
          else gradle assembleDebug --stacktrace; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/vanelle-release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          VANELLE_KEYSTORE_PATH: ${{ format('{0}/keystore/vanelle-release.jks', runner.temp) }}
          VANELLE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VANELLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VANELLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleRelease --stacktrace
          else gradle assembleRelease --stacktrace; fi

      - name: Build unsigned release APK (fallback, no keystore secret configured yet)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleRelease --stacktrace
          else gradle assembleRelease --stacktrace; fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
