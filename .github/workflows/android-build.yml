name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE. Décompression..."
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      - name: Corriger le code Kotlin
        run: |
          # Correction import Bundle
          WAKE_FILE=$(find . -name "WakeWordService.kt" | head -n 1)
          if [ -n "$WAKE_FILE" ]; then
            echo "Correction appliquée sur $WAKE_FILE"
            sed -i '1s/^/import android.os.Bundle\n/' "$WAKE_FILE"
          fi

          # Correction échappements
          CONTACTS_FILE=$(find . -name "ContactsRepository.kt" | head -n 1)
          if [ -n "$CONTACTS_FILE" ]; then
            echo "Correction appliquée sur $CONTACTS_FILE"
            sed -i 's/\\%/%/g' "$CONTACTS_FILE"
            sed -i 's/\\_/_/g' "$CONTACTS_FILE"
          fi

      - name: Lancer Gradle et vérifier la sortie
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "Erreur : gradlew introuvable !"
            exit 1
          fi

          PROJ_DIR=$(dirname "$GRADLEW_FILE")
          echo "Dossier du projet : $PROJ_DIR"
          cd "$PROJ_DIR"
          
          chmod +x gradlew
          
          # Exécution de la compilation
          ./gradlew assembleDebug --stacktrace --info

          # Inspection immédiate après le build
          echo "--- LISTE DE TOUS LES FICHIERS APRÈS GRADLE ---"
          find . -type f \( -name "*.apk" -o -name "*.aar" \)
          echo "-----------------------------------------------"

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
