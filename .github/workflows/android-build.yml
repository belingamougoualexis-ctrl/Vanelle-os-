name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          set -euo pipefail
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip" | head -20)
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Localisation du projet React Native
        id: root
        run: |
          set -euo pipefail

          GRADLE_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v node_modules | head -n 1 || true)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun settings.gradle trouvé."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          RN_ROOT=$(cd "$ANDROID_DIR/.." && pwd)

          echo "root=$RN_ROOT" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Installation des dépendances Node
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund

      - name: Correctifs Gradle (AndroidX + désactiver R8 minify)
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          for gp in $(find . -name "gradle.properties" | grep -v node_modules); do
            grep -q "android.useAndroidX" "$gp" || echo "android.useAndroidX=true" >> "$gp"
            grep -q "android.enableJetifier" "$gp" || echo "android.enableJetifier=true" >> "$gp"
            echo "REACT_NATIVE_NODE_MODULES_DIR=$(pwd)/node_modules" >> "$gp"
          done
          for f in $(find . -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" | grep -v node_modules); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f"
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f"
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f"
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f"
          done

      - name: Préparation des modèles IA embarqués
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-bundled-models.sh scripts/verify-project.sh android/gradlew || true
          ./scripts/prepare-bundled-models.sh

      - name: Compilation de l'APK Release
        working-directory: ${{ steps.root.outputs.root }}/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Trouver l'APK généré
        id: apk
        run: |
          set -euo pipefail
          APK=$(find "${{ steps.root.outputs.root }}/android/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Aucun APK trouvé !"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Vanelle-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Créer une Release + attacher l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle Release ${{ github.run_number }}
          body: |
            APK Release généré automatiquement.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
