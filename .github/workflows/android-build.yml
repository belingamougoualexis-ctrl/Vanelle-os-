name: Alpha Prime — Build APK & Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build & sign Android APK
    runs-on: ubuntu-latest
    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Installe Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # 3. Installe les dépendances JavaScript (télécharge aussi les libs natives de llama.rn)
      - name: Installation des dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # 4. Génère le projet natif Android (Expo prebuild)
      - name: Génération du projet Android natif
        run: npx expo prebuild --platform android --no-interactive

      # 5. Build et signe l'APK release avec Gradle
      - name: Build et signature de l'APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # 6. Publie l'APK comme artefact téléchargeable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alphaprime-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows (moteur desktop Python)
    runs-on: windows-latest
    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Installe Python
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop_engine/requirements.txt

      # 3. Installe les dépendances Python
      - name: Installation des dépendances
        working-directory: desktop_engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Build l'exécutable Windows
      - name: Build de l'exécutable
        working-directory: desktop_engine
        run: python build_executable.py

      # 5. Vérifie que l'exécutable a bien été produit
      - name: Vérification de l'exécutable
        working-directory: desktop_engine
        shell: bash
        run: |
          EXE=$(find dist -iname '*.exe' | head -1)
          test -n "$EXE"
          test -s "$EXE"
          echo "Exécutable trouvé : $EXE"

      # 6. Publie l'exécutable comme artefact téléchargeable
      - name: Upload exécutable Windows
        uses: actions/upload-artifact@v4
        with:
          name: alphaprime-release-windows
          path: desktop_engine/dist/
          if-no-files-found: error
