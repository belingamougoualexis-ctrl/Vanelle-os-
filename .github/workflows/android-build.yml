name: Build and Sign Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4[span_0](start_span)[span_0](end_span)

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4[span_1](start_span)[span_1](end_span)
        with:
          distribution: 'zulu[span_2](start_span)'[span_2](end_span)
          java-version: '17[span_3](start_span)'[span_3](end_span)
          cache: 'gradle[span_4](start_span)'[span_4](end_span)

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew[span_5](start_span)[span_5](end_span)

      - name: Build de l'APK Unsigned avec Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Signer l'APK Release
        id: sign_app
        uses: radditud/android-signed-apk@v1
        with:
          keystoreBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          storePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        
      - name: Upload de l'APK Signé en Artifact
        uses: actions/upload-artifact@v4[span_6](start_span)[span_6](end_span)
        with:
          name: app-release-signed
          path: ${{ steps.sign_app.outputs.signedApkPath }}
          if-no-files-found: error[span_7](start_span)[span_7](end_span)
