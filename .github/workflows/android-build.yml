name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Décompression des archives ZIP
        run: |
          echo "=== Recherche et extraction des archives ZIP ==="
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")

          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          else
            echo "Aucun fichier ZIP trouvé à la racine, continuation normale..."
          fi

      - name: 3. Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Localisation du projet et compilation
        run: |
          # Recherche du fichier settings.gradle ou build.gradle après extraction
          GRADLE_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "--------------------------------------------------------"
            echo "ERREUR : Impossible de trouver les fichiers du projet Gradle."
            echo "--------------------------------------------------------"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Projet localisé dans : $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Injection des règles ProGuard / R8
          PROGUARD_FILE="app/proguard-rules.pro"
          mkdir -p app
          echo "" >> "$PROGUARD_FILE"
          echo "# Correctifs automatiques GitHub Actions" >> "$PROGUARD_FILE"
          echo "-dontwarn javax.annotation.**" >> "$PROGUARD_FILE"
          echo "-dontwarn com.google.api.client.**" >> "$PROGUARD_FILE"
          echo "-dontwarn org.joda.time.**" >> "$PROGUARD_FILE"
          echo "-keep class com.google.crypto.tink.** { *; }" >> "$PROGUARD_FILE"

          # Execution des droits et compilation
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: 5. Génération automatique du Keystore
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: 6. Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -name "*.apk" | grep "release" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun fichier APK trouvé après la compilation."
            exit 1
          fi

          echo "APK trouvé : $UNSIGNED_APK"

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | tail -n 1)
          echo "Utilisation des Build Tools : $BUILD_TOOLS_DIR"

          ${BUILD_TOOLS_DIR}/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk app-aligned.apk

      - name: 7. Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Release-APK
          path: VanelleOS-release-signed.apk
          if-no-files-found: error
