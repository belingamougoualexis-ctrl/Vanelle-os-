name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompresser l'archive ZIP
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration de JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Réécriture propre et sans dépendance externe des fichiers Kotlin
      - name: Injection de code Kotlin propre
        run: |
          python3 - << 'EOF'
          import os

          def find_all(name):
              result = []
              for root, dirs, files in os.walk("."):
                  if name in files:
                      result.append(os.path.join(root, name))
              return result

          # 1. NETTOYAGE DU CONTACTS REPOSITORY (Suppression des antislashs illégaux)
          for path in find_all("ContactsRepository.kt"):
              print(f"Nettoyage de : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              # Correction basique de la chaîne de texte avec échappements invalides
              clean_content = content.replace(r'\%', '%').replace(r'\_', '_').replace(r'\(', '(').replace(r'\)', ')')
              with open(path, "w", encoding="utf-8") as f:
                  f.write(clean_content)

          # 2. NETTOYAGE DE FRAGMENTS.KT (Correction des 'Conflicting declarations')
          for path in find_all("Fragments.kt"):
              print(f"Correction des conflits dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              seen_vars = set()

              for line in lines:
                  if "fun " in line or "class " in line or "override" in line:
                      seen_vars.clear()

                  # Si une variable est redéclarée avec val, on retire le mot clé val
                  if "val legalCol" in line:
                      if "legalCol" in seen_vars:
                          line = line.replace("val legalCol", "legalCol")
                      else:
                          seen_vars.add("legalCol")
                  elif "val privacyBtn" in line:
                      if "privacyBtn" in seen_vars:
                          line = line.replace("val privacyBtn", "privacyBtn")
                      else:
                          seen_vars.add("privacyBtn")
                  elif "val termsBtn" in line:
                      if "termsBtn" in seen_vars:
                          line = line.replace("val termsBtn", "termsBtn")
                      else:
                          seen_vars.add("termsBtn")

                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # 3. REÉCRITURE SÉCURISÉE DE MEMORYVAULT.KT (Compatibilité SharedPreferences)
          memory_vault_code = """package com.vanelle.os

          import android.content.Context
          import android.content.SharedPreferences

          class MemoryVault(context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("secret_vault_prefs", Context.MODE_PRIVATE)

              fun saveString(key: String, value: String) {
                  prefs.edit().putString(key, value).apply()
              }

              fun getString(key: String, defaultValue: String = ""): String {
                  return prefs.getString(key, defaultValue) ?: defaultValue
              }

              fun clear() {
                  prefs.edit().clear().apply()
              }
          }
          """
          for path in find_all("MemoryVault.kt"):
              print(f"Remplacement par une version stable dans : {path}")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(memory_vault_code)

          EOF

      # 4. Compilation Gradle
      - name: Compiler l'APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi

          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew

          ./gradlew assembleDebug > gradle_build.log 2>&1 || BUILD_FAILED=true

          if [ "$BUILD_FAILED" = "true" ]; then
            echo "=================================================="
            echo "       ERREURS DE COMPILATION KOTLIN DETECTEES    "
            echo "=================================================="
            grep -E "e: file://|error:" gradle_build.log || tail -n 50 gradle_build.log
            echo "=================================================="
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Export de l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
