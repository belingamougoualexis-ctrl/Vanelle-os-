name: Build AlphaPrime Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Trouver le paquet AlphaPrime
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
            -Filter "AlphaPrime_*.zip" `
            -File |
            Select-Object -First 1

          if (-not $zip) {
            Write-Error "Aucun paquet AlphaPrime_*.zip trouvé."
            Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Depth 3
            exit 1
          }

          Write-Host "Paquet trouvé : $($zip.FullName)"
          "ALPHAPRIME_ZIP=$($zip.FullName)" >> $env:GITHUB_ENV

      - name: Extraire AlphaPrime
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "AlphaPrime"

          if (Test-Path $project) {
            Remove-Item $project -Recurse -Force
          }

          New-Item -ItemType Directory -Path $project | Out-Null

          Expand-Archive `
            -Path $env:ALPHAPRIME_ZIP `
            -DestinationPath $project `
            -Force

          Write-Host "Contenu extrait :"
          Get-ChildItem $project -Recurse -Depth 2

          $req = Get-ChildItem `
            -Path $project `
            -Filter "requirements.txt" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $req) {
            Write-Error "requirements.txt introuvable dans AlphaPrime après extraction."
            exit 1
          }

          $root = $req.Directory.FullName

          Write-Host "Projet AlphaPrime détecté : $root"
          Write-Host "requirements.txt : $($req.FullName)"

          "PROJECT_ROOT=$root" >> $env:GITHUB_ENV
          "REQUIREMENTS_FILE=$($req.FullName)" >> $env:GITHUB_ENV

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier Python
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Installer les dépendances
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:REQUIREMENTS_FILE"

      - name: Vérifier les fichiers du projet
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $required = @(
            "requirements.txt",
            "run_tests.py",
            "build_executable.py"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Fichier requis absent : $file"
              exit 1
            }

            Write-Host "OK : $file"
          }

      - name: Lancer les tests réels
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python run_tests.py

      - name: Construire l'exécutable
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python build_executable.py

      - name: Vérifier l'exécutable
        shell: pwsh
        run: |
          $exe = Join-Path `
            $env:PROJECT_ROOT `
            "dist\AlphaPrime\AlphaPrime.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "AlphaPrime.exe n'a pas été généré."

            Write-Host "Contenu de dist :"

            if (Test-Path (Join-Path $env:PROJECT_ROOT "dist")) {
              Get-ChildItem `
                (Join-Path $env:PROJECT_ROOT "dist") `
                -Recurse
            }

            exit 1
          }

          $size = (Get-Item $exe).Length

          if ($size -le 0) {
            Write-Error "AlphaPrime.exe est vide."
            exit 1
          }

          Write-Host "EXE généré avec succès."
          Write-Host "Chemin : $exe"
          Write-Host "Taille : $size octets"

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: AlphaPrime-Windows
          path: ${{ env.PROJECT_ROOT }}/dist/AlphaPrime/
          if-no-files-found: error
