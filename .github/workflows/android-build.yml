name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi
          echo "--- Contenu après unzip ---"
          ls -la
          find . -maxdepth 3 -name package.json -o -name settings.gradle 2>/dev/null | head -20

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Correctifs Gradle (AndroidX + désactiver R8 minify)
        run: |
          for gp in $(find . -name "gradle.properties"); do
            grep -q "android.useAndroidX" "$gp" || echo "android.useAndroidX=true" >> "$gp"
            grep -q "android.enableJetifier" "$gp" || echo "android.enableJetifier=true" >> "$gp"
          done
          for f in $(find . -path "*/app/build.gradle*" -o -path "*/app/build.gradle.kts"); do
            echo "Patch minify dans : $f"
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f"
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f"
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f"
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f"
          done

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilation de l'APK (release, sans R8)
        run: |
          set -euo pipefail

          GRADLE_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v node_modules | head -n 1 || true)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun settings.gradle trouvé."
            find . -name "*.gradle*" | head -20
            exit 1
          fi
          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          RN_ROOT=$(cd "$ANDROID_DIR/.." && pwd)

          echo "ANDROID_DIR=$ANDROID_DIR"
          echo "RN_ROOT=$RN_ROOT"

          if [ ! -f "$RN_ROOT/package.json" ]; then
            echo "ERREUR : package.json absent dans $RN_ROOT"
            ls -la "$RN_ROOT"
            exit 1
          fi

          cd "$RN_ROOT"
          echo "npm install dans $(pwd)"
          npm install --include=dev --no-audit --no-fund

          if [ ! -d "$RN_ROOT/node_modules/@react-native/gradle-plugin" ]; then
            echo "ERREUR : plugin toujours absent après npm install"
            ls -la "$RN_ROOT/node_modules" | head -30
            exit 1
          fi
          echo "OK plugin : $RN_ROOT/node_modules/@react-native/gradle-plugin"

          if [ -f "$RN_ROOT/scripts/prepare-bundled-models.sh" ]; then
            chmod +x "$RN_ROOT/scripts/"*.sh "$ANDROID_DIR/gradlew" || true
            "$RN_ROOT/scripts/prepare-bundled-models.sh"
          fi

          cd "$ANDROID_DIR"
          echo "Gradle dans $(pwd)"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            gradle :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Génération du Keystore de signature
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*" -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find . -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          fi

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK trouvé."
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "APK trouvé : $UNSIGNED_APK"
          ls -la "$UNSIGNED_APK"

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | tail -n 1)

          ${BUILD_TOOLS_DIR}/zipalign -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk app-aligned.apk

          ls -la VanelleOS-release-signed.apk

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VanelleOS ${{ github.run_number }}
          body: |
            APK release signé — téléchargeable sur téléphone.
            Désinstalle l'ancienne version avant d'installer si la signature a changé.
          files: VanelleOS-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lien de téléchargement
        run: |
          echo "## APK prêt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Télécharger :**" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/\( {{ github.repository }}/releases/download/v \){{ github.run_number }}/VanelleOS-release-signed.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Page Releases :** https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY 
