name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Décompression des archives ZIP
        run: |
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi

      - name: 2.5 Corriger la configuration AndroidX, ressources et erreurs Kotlin
        run: |
          # 1. Activation globale d'AndroidX
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 2. Suppression des ressources d'icônes adaptatives cassées
          rm -rf app/src/main/res/mipmap-anydpi-v26

          # 3. Correctif automatique pour WebSearchHelper.kt
          if [ -f "app/src/main/java/com/vanelle/os/WebSearchHelper.kt" ]; then
            sed -i 's/= return /{ /g' app/src/main/java/com/vanelle/os/WebSearchHelper.kt || true
          fi

      - name: 3. Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Neutraliser R8 et Lint dans les scripts Gradle
        run: |
          # Forcer minifyEnabled false et shrinkResources false sur tous les fichiers build.gradle
          find . -name "build.gradle*" -exec sed -i 's/minifyEnabled true/minifyEnabled false/g' {} + || true
          find . -name "build.gradle*" -exec sed -i 's/shrinkResources true/shrinkResources false/g' {} + || true

          # Désactiver toutes les tâches R8/Proguard en injectant du code à la fin des fichiers build.gradle
          for f in $(find . -name "build.gradle"); do
            echo -e "\ngradle.taskGraph.whenReady { taskGraph -> taskGraph.allTasks.each { task -> if (task.name.contains('R8') || task.name.contains('minify') || task.name.contains('Lint')) { task.enabled = false } } }" >> "$f"
          done

      - name: 5. Localisation du projet et compilation
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun fichier Gradle trouvé."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Dossier du projet : $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: 6. Génération du Keystore de signature
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: 7. Alignement et Signature de l'APK
        run: |
          # Recherche de tout APK généré (release ou autre)
          UNSIGNED_APK=$(find . -name "*.apk" | grep -v "signed" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun fichier APK trouvé."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | tail -n 1)

          ${BUILD_TOOLS_DIR}/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk app-aligned.apk

      - name: 8. Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Release-APK
          path: VanelleOS-release-signed.apk
          if-no-files-found: error
