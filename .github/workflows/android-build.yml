name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Décompresser l'archive (si existante)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP détectée : $ZIP_FILE. Décompression..."
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      - name: Corriger le code Kotlin et Compiler
        run: |
          GRADLE_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Erreur : build.gradle introuvable !"
            exit 1
          fi

          PROJ_DIR=$(dirname "$GRADLE_FILE")
          echo "Dossier du projet : $PROJ_DIR"
          cd "$PROJ_DIR"

          # 1. Correction import Bundle
          WAKE_FILE=$(find . -name "WakeWordService.kt" | head -n 1)
          if [ -n "$WAKE_FILE" ]; then
            sed -i '1s/^/import android.os.Bundle\n/' "$WAKE_FILE"
          fi

          # 2. Correction échappements
          CONTACTS_FILE=$(find . -name "ContactsRepository.kt" | head -n 1)
          if [ -n "$CONTACTS_FILE" ]; then
            sed -i 's/\\%/%/g' "$CONTACTS_FILE"
            sed -i 's/\\_/_/g' "$CONTACTS_FILE"
          fi

          # 3. Compilation forcée
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Trouver et déplacer l'APK
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;
          echo "Contenu du dossier d'export :"
          ls -la output_apk/

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
