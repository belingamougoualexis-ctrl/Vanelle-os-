name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompression de l'archive si elle existe
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Correcteur structurel Kotlin
      - name: Correction structurelle du code Kotlin
        run: |
          python3 - << 'EOF'
          import os, re

          def find_all(name):
              res = []
              for root, dirs, files in os.walk("."):
                  if name in files:
                      res.append(os.path.join(root, name))
              return res

          # --- FIX 1: ContactsRepository.kt (Purger les antislashs invalides) ---
          for path in find_all("ContactsRepository.kt"):
              print(f"[Fix] Nettoyage des antislashs dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              new_lines = [re.sub(r'\\([_%\(\)\.=\+])', r'\1', line) for line in lines]
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # --- FIX 2: Fragments.kt (Renumérotation des doublons val) ---
          for path in find_all("Fragments.kt"):
              print(f"[Fix] Renommage des variables en double dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              var_counts = {}

              for line in lines:
                  if "fun " in line or "class " in line or "override" in line:
                      var_counts.clear()

                  match = re.search(r'\bval\s+(legalCol|privacyBtn|termsBtn)\b', line)
                  if match:
                      var_name = match.group(1)
                      var_counts[var_name] = var_counts.get(var_name, 0) + 1
                      if var_counts[var_name] > 1:
                          # Renomme la variable locale en doublon (ex: legalCol_2)
                          new_var = f"{var_name}_{var_counts[var_name]}"
                          line = re.sub(r'\bval\s+' + var_name + r'\b', f"val {new_var}", line)

                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # --- FIX 3: MemoryVault.kt (Remplacement par un composant robuste sans dépendance) ---
          memory_vault_code = """package com.vanelle.os

          import android.content.Context
          import android.content.SharedPreferences

          class MemoryVault(private val context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("memory_vault_prefs", Context.MODE_PRIVATE)

              fun getString(key: String, defValue: String = ""): String = prefs.getString(key, defValue) ?: defValue
              fun putString(key: String, value: String) = prefs.edit().putString(key, value).apply()
              fun saveString(key: String, value: String) = putString(key, value)
              fun get(key: String, defValue: String = ""): String = getString(key, defValue)
              fun save(key: String, value: String) = putString(key, value)
              fun clear() = prefs.edit().clear().apply()

              companion object {
                  @Volatile private var instance: MemoryVault? = null
                  fun getInstance(context: Context): MemoryVault =
                      instance ?: synchronized(this) {
                          instance ?: MemoryVault(context.applicationContext).also { instance = it }
                      }
              }
          }
          """
          for path in find_all("MemoryVault.kt"):
              print(f"[Fix] Réécriture sécurisée de : {path}")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(memory_vault_code)
          EOF

      # 4. Compilation avec Gradle
      - name: Compiler l'APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi

          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew

          ./gradlew assembleDebug > gradle_build.log 2>&1 || BUILD_FAILED=true

          if [ "$BUILD_FAILED" = "true" ]; then
            echo "=================================================="
            echo "       ERREURS DE COMPILATION KOTLIN DETECTEES    "
            echo "=================================================="
            grep -E "e: file://|error:" gradle_build.log || tail -n 50 gradle_build.log
            echo "=================================================="
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Export de l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
