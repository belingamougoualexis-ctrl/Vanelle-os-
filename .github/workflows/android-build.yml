name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          set -euo pipefail
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip" | head -20)
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Localisation du projet React Native
        id: root
        run: |
          set -euo pipefail

          GRADLE_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v node_modules | head -n 1 || true)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun settings.gradle trouvé."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          RN_ROOT=$(cd "$ANDROID_DIR/.." && pwd)

          echo "root=$RN_ROOT" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Installation des dépendances Node
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund

      - name: Correctifs Gradle (AndroidX + désactiver R8 minify)
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          for gp in $(find . -name "gradle.properties" | grep -v node_modules); do
            grep -q "android.useAndroidX" "$gp" || echo "android.useAndroidX=true" >> "$gp"
            grep -q "android.enableJetifier" "$gp" || echo "android.enableJetifier=true" >> "$gp"
            echo "REACT_NATIVE_NODE_MODULES_DIR=$(pwd)/node_modules" >> "$gp"
          done
          for f in $(find . -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" | grep -v node_modules); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f"
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f"
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f"
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f"
          done

      - name: Préparation des modèles IA embarqués
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-bundled-models.sh scripts/verify-project.sh android/gradlew || true
          ./scripts/prepare-bundled-models.sh

      - name: Compilation de l'APK Release
        working-directory: ${{ steps.root.outputs.root }}/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Trouver l'APK généré
        id: apk
        run: |
          set -euo pipefail
          APK=$(find "${{ steps.root.outputs.root }}/android/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Aucun APK trouvé !"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      # Signature : utilise les secrets s'ils existent, sinon génère un keystore
      # de secours à la volée pour que l'APK reste installable (build de test,
      # signature différente à chaque run tant que les vrais secrets ne sont pas configurés).
      - name: Signer l'APK (secrets si présents, sinon keystore de secours)
        id: sign
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signing
          UNSIGNED="${{ steps.apk.outputs.path }}"
          SIGNED_DIR="$(dirname "$UNSIGNED")"
          SIGNED="$SIGNED_DIR/Vanelle-signed.apk"

          if [[ -n "${SIGNING_KEYSTORE_BASE64:-}" ]]; then
            echo "Secrets de signature détectés — utilisation du keystore permanent."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/release.jks
            STORE_PASS="$SIGNING_STORE_PASSWORD"
            KEY_ALIAS="$SIGNING_KEY_ALIAS"
            KEY_PASS="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
          else
            echo "::warning::Aucun secret de signature configuré — génération d'un keystore de secours (build de test, non stable entre les runs)."
            STORE_PASS="vanelle-temp-pass"
            KEY_ALIAS="vanelle-temp"
            KEY_PASS="vanelle-temp-pass"
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Vanelle Test, OU=CI, O=Vanelle, L=NA, S=NA, C=FR"
          fi

          if command -v apksigner >/dev/null 2>&1; then
            apksigner sign --ks signing/release.jks \
              --ks-pass "pass:$STORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$SIGNED" "$UNSIGNED"
          else
            echo "::error::apksigner indisponible — impossible de signer l'APK"
            exit 1
          fi

          echo "path=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$SIGNED")" >> "$GITHUB_OUTPUT"

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Vanelle-signed-apk
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Créer une Release + attacher l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle Release ${{ github.run_number }}
          body: |
            APK Release généré et signé automatiquement.
          files: ${{ steps.sign.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
