name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # --- ÉTAPE DE CORRECTION AUTOMATIQUE DES ERREURS KOTLIN ---
      - name: Corriger les erreurs de code Kotlin
        run: |
          # 1. Ajout de l'import 'android.os.Bundle' manquant dans WakeWordService.kt
          FILE_WAKE="dossier_decompresse/app/src/main/java/com/vanelle/os/WakeWordService.kt"
          if [ -f "$FILE_WAKE" ]; then
            sed -i '1s/^/import android.os.Bundle\n/' "$FILE_WAKE"
            echo "Import Bundle ajouté dans WakeWordService.kt"
          fi

          # 2. Correction des échappements invalides \% et \_ dans ContactsRepository.kt
          FILE_CONTACTS="dossier_decompresse/app/src/main/java/com/vanelle/os/ContactsRepository.kt"
          if [ -f "$FILE_CONTACTS" ]; then
            sed -i 's/\\%/%/g' "$FILE_CONTACTS"
            sed -i 's/\\_/_/g' "$FILE_CONTACTS"
            echo "Échappements corrigés dans ContactsRepository.kt"
          fi

      - name: Donner les permissions d'exécution à gradlew
        run: chmod +x gradlew || true

      - name: Build APK avec Gradle
        run: |
          PROJ_DIR=$(find dossier_decompresse -name "build.gradle*" -exec dirname {} \; | head -n 1)
          cd "$PROJ_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
