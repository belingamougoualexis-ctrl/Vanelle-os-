name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code
        uses: actions/checkout@v4

      - name: 2. Configuration de Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Génération automatique du Keystore
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: 4. Compilation de l'APK Release
        run: |
          # Trouver le dossier contenant settings.gradle ou build.gradle
          GRADLE_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "Projet Gradle détecté dans le dossier : $GRADLE_DIR"
          
          cd "$GRADLE_DIR"
          
          # Utiliser gradlew si présent, sinon gradle global
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: 5. Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun fichier APK trouvé dans le dossier build."
            exit 1
          fi

          echo "APK trouvé : $UNSIGNED_APK"

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out app-release-signed.apk app-aligned.apk

      - name: 6. Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: application-release-signee
          path: app-release-signed.apk
          if-no-files-found: error
