name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Correctifs Gradle (AndroidX + désactiver R8 minify)
        run: |
          for gp in $(find . -name "gradle.properties"); do
            grep -q "android.useAndroidX" "$gp" || echo "android.useAndroidX=true" >> "$gp"
            grep -q "android.enableJetifier" "$gp" || echo "android.enableJetifier=true" >> "$gp"
          done
          for f in $(find . -path "*/app/build.gradle*" -o -path "*/app/build.gradle.kts"); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f"
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f"
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f"
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f"
          done

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilation de l'APK (release, sans R8)
        run: |
          set -euo pipefail
          GRADLE_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v node_modules | head -n 1 || true)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun settings.gradle trouvé."
            exit 1
          fi
          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          RN_ROOT=$(cd "$ANDROID_DIR/.." && pwd)
          echo "ANDROID_DIR=$ANDROID_DIR"
          echo "RN_ROOT=$RN_ROOT"
          test -f "$RN_ROOT/package.json"
          cd "$RN_ROOT"
          npm install --include=dev --no-audit --no-fund
          test -d node_modules/@react-native/gradle-plugin
          cat > "$ANDROID_DIR/settings.gradle" << 'SETTINGS'
          pluginManagement {
              includeBuild("../node_modules/@react-native/gradle-plugin")
          }
          plugins {
              id("com.facebook.react.settings")
          }
          extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
              ex.autolinkLibrariesFromCommand()
          }
          rootProject.name = 'Vanelle'
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          SETTINGS
          sed -i 's/^ //' "$ANDROID_DIR/settings.gradle"
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.4.1-bin.zip|' \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          cat > "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainApplication.kt" << 'KOTLIN'
          package com.vanelle.app

          import android.app.Application
          import com.facebook.react.PackageList
          import com.facebook.react.ReactApplication
          import com.facebook.react.ReactHost
          import com.facebook.react.ReactNativeHost
          import com.facebook.react.ReactPackage
          import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint.load
          import com.facebook.react.defaults.DefaultReactHost.getDefaultReactHost
          import com.facebook.react.defaults.DefaultReactNativeHost
          import com.facebook.react.soloader.OpenSourceMergedSoMapping
          import com.facebook.soloader.SoLoader

          class MainApplication : Application(), ReactApplication {

            override val reactNativeHost: ReactNativeHost =
                object : DefaultReactNativeHost(this@MainApplication) {
                  override fun getPackages(): List<ReactPackage> =
                      PackageList(this@MainApplication).packages.apply {
                        add(VanelleNativePackage())
                      }

                  override fun getJSMainModuleName(): String = "index"

                  override fun getUseDeveloperSupport(): Boolean = BuildConfig.DEBUG

                  override val isNewArchEnabled: Boolean = BuildConfig.IS_NEW_ARCHITECTURE_ENABLED
                  override val isHermesEnabled: Boolean = BuildConfig.IS_HERMES_ENABLED
                }

            override val reactHost: ReactHost
              get() = getDefaultReactHost(applicationContext, reactNativeHost)

            override fun onCreate() {
              super.onCreate()
              SoLoader.init(this, OpenSourceMergedSoMapping)
              if (BuildConfig.IS_NEW_ARCHITECTURE_ENABLED) {
                load()
              }
            }
          }
          KOTLIN
          sed -i 's/^ //' "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainApplication.kt"
          if [ -f "$RN_ROOT/scripts/prepare-bundled-models.sh" ]; then
            chmod +x "$RN_ROOT/scripts/"*.sh
            "$ANDROID_DIR/gradlew" || true
            "$RN_ROOT/scripts/prepare-bundled-models.sh"
          fi
          cd "$ANDROID_DIR"
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Génération automatique du Keystore
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*" -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find . -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          fi
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK trouvé."
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | tail -n 1)
          ${BUILD_TOOLS_DIR}/zipalign -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk app-aligned.apk

          ls -la VanelleOS-release-signed.apk

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VanelleOS ${{ github.run_number }}
          body: |
            APK release signé dynamiquement.
            ATTENTION : Pensez à désinstaller la version précédente de votre téléphone avant d'installer celle-ci.
          files: VanelleOS-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Génération du lien de téléchargement (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-release-signed-${{ github.run_number }}
          path: VanelleOS-release-signed.apk
          retention-days: 30
