name: Build and Sign Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout du projet
        uses: actions/checkout@v4

      # ============================================================
      # 2. Vérification STRICTE de la structure
      # ============================================================
      - name: Vérifier la structure du projet
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STRUCTURE DU PROJET"
          echo "=========================================="

          echo "Répertoire :"
          pwd

          echo ""
          echo "Contenu :"
          ls -la

          if [ ! -f package.json ]; then
            echo ""
            echo "ERREUR : package.json n'est pas à la racine."
            echo ""
            echo "Fichiers package.json trouvés :"
            find . -type f -name package.json \
              -not -path "./.git/*" \
              -print
            exit 1
          fi

          if [ ! -d android ]; then
            echo "ERREUR : android/ n'est pas à la racine."
            exit 1
          fi

          if [ ! -f android/settings.gradle ]; then
            echo "ERREUR : android/settings.gradle absent."
            exit 1
          fi

          if [ ! -f android/build.gradle ]; then
            echo "ERREUR : android/build.gradle absent."
            exit 1
          fi

          if [ ! -f android/app/build.gradle ]; then
            echo "ERREUR : android/app/build.gradle absent."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERREUR : android/gradlew absent."
            exit 1
          fi

          echo ""
          echo "Structure racine correcte."

          echo ""
          echo "Recherche de structures imbriquées suspectes :"

          if [ -d fixsrc ]; then
            echo "ERREUR : dossier fixsrc détecté."
            echo "Le projet ne doit PAS contenir fixsrc/."
            exit 1
          fi

          if [ -d project ]; then
            echo "ERREUR : dossier project détecté."
            echo "Le projet doit être directement à la racine."
            exit 1
          fi

          echo "Aucune structure imbriquée détectée."

      # ============================================================
      # 3. Node.js
      # ============================================================
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package.json

      # ============================================================
      # 4. Java 17
      # ============================================================
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. Android SDK
      # ============================================================
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. Vérification des versions
      # ============================================================
      - name: Vérifier Node Java npm
        run: |
          set -euo pipefail

          echo "Node :"
          node --version

          echo ""
          echo "npm :"
          npm --version

          echo ""
          echo "Java :"
          java -version

      # ============================================================
      # 7. Installation des dépendances
      # ============================================================
      - name: Installer les dépendances React Native
        run: |
          set -euo pipefail

          echo "Installation depuis :"
          pwd

          npm install \
            --include=dev \
            --no-audit \
            --no-fund

          echo ""
          echo "Vérification de React Native..."

          test -d node_modules/react-native
          test -f node_modules/react-native/package.json

          echo "React Native présent."

          echo ""
          echo "Vérification du React Native Gradle Plugin..."

          test -d node_modules/@react-native/gradle-plugin
          test -f node_modules/@react-native/gradle-plugin/package.json

          echo "Plugin présent."

          echo ""
          echo "Chemin du plugin :"
          realpath node_modules/@react-native/gradle-plugin

      # ============================================================
      # 8. Vérifier les versions React Native
      # ============================================================
      - name: Vérifier React Native 0.87.0
        run: |
          set -euo pipefail

          RN_VERSION=$(node -p \
            "require('./node_modules/react-native/package.json').version")

          PLUGIN_VERSION=$(node -p \
            "require('./node_modules/@react-native/gradle-plugin/package.json').version")

          echo "React Native : $RN_VERSION"
          echo "Gradle Plugin : $PLUGIN_VERSION"

          if [ "$RN_VERSION" != "0.87.0" ]; then
            echo "ERREUR : React Native 0.87.0 attendu."
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "0.87.0" ]; then
            echo "ERREUR : @react-native/gradle-plugin 0.87.0 attendu."
            exit 1
          fi

          echo "Versions correctes."

      # ============================================================
      # 9. Vérifier settings.gradle
      # ============================================================
      - name: Vérifier settings.gradle
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "android/settings.gradle"
          echo "=========================================="

          cat android/settings.gradle

          grep -q '@react-native/gradle-plugin' \
            android/settings.gradle

          echo ""
          echo "Plugin React Native référencé correctement."

      # ============================================================
      # 10. Vérifier le wrapper Gradle
      # ============================================================
      - name: Préparer Gradle
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version

      # ============================================================
      # 11. AndroidX
      # ============================================================
      - name: Vérifier AndroidX
        run: |
          set -euo pipefail

          touch android/gradle.properties

          if ! grep -q '^android.useAndroidX=true' \
              android/gradle.properties; then
            echo 'android.useAndroidX=true' \
              >> android/gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=true' \
              android/gradle.properties; then
            echo 'android.enableJetifier=true' \
              >> android/gradle.properties
          fi

          echo "gradle.properties :"
          cat android/gradle.properties

      # ============================================================
      # 12. Préparer les modèles GGUF
      # ============================================================
      - name: Préparer les modèles GGUF
        run: |
          set -euo pipefail

          if [ ! -f scripts/prepare-bundled-models.sh ]; then
            echo "ERREUR : script prepare-bundled-models.sh absent."
            exit 1
          fi

          chmod +x scripts/prepare-bundled-models.sh

          ./scripts/prepare-bundled-models.sh

          echo ""
          echo "Modèles GGUF :"

          find android/app/src/main/assets/models \
            -maxdepth 1 \
            -type f \
            -name "*.gguf" \
            -exec ls -lh {} \;

      # ============================================================
      # 13. Audit final avant Gradle
      # ============================================================
      - name: Audit complet avant compilation
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AUDIT FINAL"
          echo "=========================================="

          test -f package.json
          test -d node_modules
          test -d node_modules/react-native
          test -d node_modules/@react-native/gradle-plugin

          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo ""
          echo "Racine :"
          pwd

          echo ""
          echo "Plugin RN :"
          realpath node_modules/@react-native/gradle-plugin

          echo ""
          echo "Gradle settings :"
          realpath android/settings.gradle

          echo ""
          echo "Projet Android :"
          realpath android

          echo ""
          echo "Audit terminé avec succès."

      # ============================================================
      # 14. Nettoyage Gradle
      # ============================================================
      - name: Nettoyer Gradle
        working-directory: android
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 15. Compilation Release
      # ============================================================
      - name: Compiler APK Release
        working-directory: android
        run: |
          set -euo pipefail

          echo "Projet Gradle :"
          pwd

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 16. Vérifier APK
      # ============================================================
      - name: Vérifier APK généré
        run: |
          set -euo pipefail

          echo "APK générés :"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "ERREUR : aucun APK Release."
            exit 1
          fi

          echo ""
          echo "APK : $APK"
          ls -lh "$APK"

      # ============================================================
      # 17. Générer le keystore
      # ============================================================
      - name: Générer le keystore
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=Vanelle OS, OU=Build, O=Vanelle, L=Yaounde, S=Centre, C=CM"

      # ============================================================
      # 18. Alignement + signature
      # ============================================================
      - name: Aligner et signer APK
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          echo "Build Tools : $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -v \
            -p 4 \
            "$APK" \
            app-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk \
            app-aligned.apk

          ls -lh VanelleOS-release-signed.apk

      # ============================================================
      # 19. Vérifier la signature
      # ============================================================
      - name: Vérifier la signature
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            VanelleOS-release-signed.apk

          echo "Signature valide."

      # ============================================================
      # 20. SHA-256
      # ============================================================
      - name: Calculer SHA-256
        run: |
          set -euo pipefail

          sha256sum \
            VanelleOS-release-signed.apk \
            | tee VanelleOS-release-signed.apk.sha256

      # ============================================================
      # 21. GitHub Release
      # ============================================================
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle OS ${{ github.run_number }}
          body: |
            Vanelle OS — APK Release

            APK compilé et signé automatiquement.

            Les modèles GGUF sont préparés pendant le build
            et intégrés à l'application.

            SHA-256 disponible dans le fichier correspondant.
          files: |
            VanelleOS-release-signed.apk
            VanelleOS-release-signed.apk.sha256
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 22. Résumé
      # ============================================================
      - name: Résumé du build
        run: |
          echo "## ✅ Vanelle OS — Build réussi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK : VanelleOS-release-signed.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 :" >> "$GITHUB_STEP_SUMMARY"
          cat VanelleOS-release-signed.apk.sha256 \
            >> "$GITHUB_STEP_SUMMARY"
