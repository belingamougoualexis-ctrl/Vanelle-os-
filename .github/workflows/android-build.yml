name: Alpha Prime — Build, Sign & Publish (Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NODE_VERSION: '22.13.1'
  JAVA_VERSION: '17'

jobs:
  # 1) Vérification mobile (structure + types + tests)
  verify-source:
    name: '1 - Vérification source mobile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la structure du dépôt
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f app.json
          test -f App.tsx
          test -f scripts/release_gate.py
          echo 'Structure mobile OK'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --no-audit --no-fund
      - run: python3 scripts/release_gate.py
      - run: npx expo-doctor
      - run: npm run typecheck
      - run: npm test -- --runInBand

  # 2) Build + signature réelle de l'APK Android (keystore, sans EAS)
  build-android:
    name: '2 - Build & signature Android'
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --no-audit --no-fund

      - name: Générer le projet Android natif (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK release
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Aligner et signer l'APK avec le vrai keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERREUR - secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD manquants."
            exit 1
          fi
          UNSIGNED_APK=$(find android -path "*/outputs/apk/release/*" -name "*.apk" | head -n 1)
          test -n "$UNSIGNED_APK"
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out AlphaPrime-signed.apk \
            app-aligned.apk
          rm -f release.jks
          mkdir -p artifacts/android
          cp AlphaPrime-signed.apk artifacts/android/AlphaPrime-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPrime-Android
          path: artifacts/android/
          if-no-files-found: error

  # 3) Publication automatique sur GitHub Releases
  publish:
    name: '3 - Publication GitHub Release'
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: AlphaPrime-Android, path: release/android }

      - name: Valider le binaire
        shell: bash
        run: |
          set -euo pipefail
          test -s release/android/AlphaPrime-signed.apk
          echo 'APK présent et non vide'

      - name: Créer la release GitHub
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Alpha Prime ${{ github.run_number }}
          body: |
            Build automatique signé - Alpha Prime Android.
          files: release/android/AlphaPrime-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Résumé du lien de téléchargement
        shell: bash
        run: |
          {
            echo "## Alpha Prime Android - livrable"
            echo ""
            echo "Page de la release - ${{ steps.publish_release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
