name: Alpha Prime — Build & Sign (Android + Windows)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.1'
  PYTHON_VERSION: '3.11'

jobs:
  # 1) Vérification du code mobile (structure + types + tests)
  verify-source:
    name: '1 — Vérification source (mobile)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la structure du dépôt
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f app.json
          test -f App.tsx
          test -f scripts/release_gate.py
          test -f assets/icon.png
          echo 'Structure mobile : OK'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci || npm install --no-audit --no-fund

      - name: Intégrité du build (release gate)
        run: python3 scripts/release_gate.py

      - run: npx expo-doctor
      - run: npm run typecheck
      - run: npm test -- --runInBand

  # 2) Vérification du moteur desktop (compilation + tests réels)
  verify-desktop:
    name: '2 — Vérification source (desktop)'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la structure desktop
        shell: pwsh
        run: |
          $required = @(
            'desktop_engine\requirements.txt',
            'desktop_engine\run_tests.py',
            'desktop_engine\build_executable.py',
            'desktop_engine\ai_training_os\core.py'
          )
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $f))) { throw "Fichier manquant : $f" }
          }
          Write-Host 'Structure desktop : OK'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/desktop_engine/requirements.txt

      - working-directory: desktop_engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Release gate
        shell: pwsh
        run: python scripts\release_gate.py

      - name: Validation syntaxique Python
        working-directory: desktop_engine
        shell: pwsh
        run: python -m compileall -q ai_training_os tests

      - name: Tests réels (régression + reality tests)
        working-directory: desktop_engine
        shell: pwsh
        run: python run_tests.py --timeout 600

  # 3) Build + signature Windows
  build-windows:
    name: '3 — Build & signature Windows'
    needs: verify-desktop
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/desktop_engine/requirements.txt

      - working-directory: desktop_engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compiler l'exécutable Windows
        working-directory: desktop_engine
        shell: pwsh
        run: python build_executable.py

      - name: Vérifier l'exécutable généré
        working-directory: desktop_engine
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\AlphaPrime\AlphaPrime.exe'
          if (-not (Test-Path $exe)) { throw 'AlphaPrime.exe manquant.' }
          if ((Get-Item $exe).Length -le 0) { throw 'AlphaPrime.exe vide.' }
          Write-Host "Exécutable Windows : OK — $((Get-Item $exe).Length) octets"

      - name: Décoder le certificat de signature
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
        if: ${{ env.PFX_B64 != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", $bytes)

      - name: Signer AlphaPrime.exe (Authenticode)
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PASS: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        if: ${{ env.PFX_B64 != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\codesign.pfx" /p "$env:PFX_PASS" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "desktop_engine\dist\AlphaPrime\AlphaPrime.exe"
          & $signtool verify /pa "desktop_engine\dist\AlphaPrime\AlphaPrime.exe"

      - name: Avertir si non signé
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
        if: ${{ env.PFX_B64 == '' }}
        shell: pwsh
        run: Write-Warning "WINDOWS_CODESIGN_PFX absent — executable NON signe."

      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPrime-Windows
          path: desktop_engine/dist/AlphaPrime/
          if-no-files-found: error

  # 4) Build + signature Android (APK release signé via EAS)
  build-android:
    name: '4 — Build & signature Android'
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci || npm install --no-audit --no-fund
      - run: npm install --global eas-cli

      - name: Vérifier le token EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN manquant.'; exit 1; }

      - name: Build APK release (signé, credentials gérés par EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile device-android --non-interactive --wait

      - name: Télécharger l'APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          npx eas-cli build:download --platform android --output artifacts/android/AlphaPrime-signed.apk --non-interactive
          test -s artifacts/android/AlphaPrime-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPrime-Android
          path: artifacts/android/
          if-no-files-found: error

  # 5) Contrôle final : les deux binaires signés existent bien
  release-gate:
    name: '5 — Contrôle final'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AlphaPrime-Windows
          path: check/windows
      - uses: actions/download-artifact@v4
        with:
          name: AlphaPrime-Android
          path: check/android

      - name: Valider les livrables
        shell: bash
        run: |
          set -euo pipefail
          test -f check/windows/AlphaPrime.exe
          test -s check/windows/AlphaPrime.exe
          test -f check/android/AlphaPrime-signed.apk
          test -s check/android/AlphaPrime-signed.apk
          echo 'PIPELINE COMPLET : Windows + Android présents et non vides.'
