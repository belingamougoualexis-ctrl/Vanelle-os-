name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompresser le ZIP s'il existe
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration de JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Corrections ciblées sans dégrader la syntaxe Kotlin
      - name: Préparation et correction du code Kotlin
        run: |
          python3 - << 'EOF'
          import os, re, glob

          def find_files(pattern):
              return glob.glob(f"./**/{pattern}", recursive=True)

          # --- FIX 1: ContactsRepository.kt (Remplacement littéral sécurisé) ---
          for path in find_files("ContactsRepository.kt"):
              print(f"Nettoyage littéral dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace(r'\%', '%').replace(r'\_', '_')
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- FIX 2: Fragments.kt (Neutralisation par commentaire des doublons) ---
          for path in find_files("Fragments.kt"):
              print(f"Neutralisation des redéclarations dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              seen_vars = set()

              for line in lines:
                  if "fun " in line or "override" in line:
                      seen_vars.clear()

                  match = re.search(r"^\s*val\s+(legalCol|privacyBtn|termsBtn)\b", line)
                  if match:
                      var_name = match.group(1)
                      if var_name in seen_vars:
                          # Commente la ligne en doublon au lieu de casser la déclaration
                          line = "// " + line
                      else:
                          seen_vars.add(var_name)
                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # --- FIX 3: MemoryVault.kt (Imports MasterKey) ---
          for path in find_files("MemoryVault.kt"):
              print(f"Ajout des imports dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              imports = (
                  "\nimport androidx.security.crypto.MasterKey\n"
                  "import androidx.security.crypto.EncryptedSharedPreferences\n"
              )
              if "androidx.security.crypto.MasterKey" not in content:
                  content = re.sub(r'(package\s+[^\n]+)', r'\1' + imports, content, count=1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- FIX 4: build.gradle (Injection security-crypto 1.1.0-alpha06) ---
          gradle_files = find_files("build.gradle") + find_files("build.gradle.kts")
          for path in gradle_files:
              if "app" in path:
                  print(f"Ajout de security-crypto (alpha06) dans : {path}")
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()

                  if "security-crypto" not in content:
                      dep = '\n    implementation "androidx.security:security-crypto:1.1.0-alpha06"\n'
                      content = re.sub(r'dependencies\s*\{', 'dependencies {' + dep, content, count=1)
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          EOF

      # 4. Compilation Gradle
      - name: Compiler avec Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi

          DIR=$(dirname "$GRADLEW_PATH")
          echo "Dossier du projet : $DIR"
          cd "$DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Téléversement de l'APK
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
