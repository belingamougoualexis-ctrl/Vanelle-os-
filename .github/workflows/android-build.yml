name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Télécharger le projet
      uses: actions/checkout@v4

    - name: Installer Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Installer Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Décompresser le fichier ZIP
      run: |
        unzip -o *.zip -d dossier_decompresse

    - name: Compiler l'APK
      run: |
        # On se déplace là où se trouve le fichier build.gradle
        PROJ_DIR=$(find dossier_decompresse -name "build.gradle*" -exec dirname {} \; | head -n 1)
        cd "$PROJ_DIR"
        gradle assembleDebug

    - name: Récupérer l'APK
      uses: actions/upload-artifact@v4
      with:
        name: VanelleOS-APK
        path: "**/*.apk"
