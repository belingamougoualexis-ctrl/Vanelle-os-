name: Build and Sign Vanelle Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_ZIP: Vanelle-Android-CRASHFIX-v13-FINAL.zip

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. RÉCUPÉRATION DU DÉPÔT
      # ============================================================
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. LOCALISATION STRICTE DU ZIP SOURCE
      #
      # IMPORTANT :
      # Aucun "find *.zip" global.
      # Un seul ZIP est autorisé comme source.
      # ============================================================
      - name: Vérification du ZIP Vanelle source
        shell: bash
        run: |
          set -euo pipefail

          echo "ZIP source attendu : $SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERREUR : le ZIP source $SOURCE_ZIP est introuvable."
            echo
            echo "ZIP présents dans le dépôt :"
            find . \
              -path './.git' -prune -o \
              -name '*.zip' \
              -type f \
              -print || true
            exit 1
          fi

          echo "ZIP source trouvé : $SOURCE_ZIP"

          mkdir -p "$GITHUB_WORKSPACE/source-zip"
          cp "$SOURCE_ZIP" "$GITHUB_WORKSPACE/source-zip/source.zip"

          echo "SOURCE_ARCHIVE=$GITHUB_WORKSPACE/source-zip/source.zip" >> "$GITHUB_ENV"

      # ============================================================
      # 3. EXTRACTION DANS UN DOSSIER PROPRE
      #
      # Aucun ancien fichier du dépôt n'est fusionné avec le projet.
      # ============================================================
      - name: Extraction propre du projet Vanelle
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="$GITHUB_WORKSPACE/vanelle-source"

          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"

          echo "Extraction de l'unique source Vanelle..."

          unzip -q "$SOURCE_ARCHIVE" -d "$BUILD_ROOT"

          echo "Contenu initial de l'archive :"
          find "$BUILD_ROOT" -maxdepth 2 -type f | sort

      # ============================================================
      # 4. NORMALISATION DU ROOT DU ZIP
      #
      # Le ZIP v13 contient directement :
      # package.json
      # android/
      # src/
      # scripts/
      #
      # Cette étape permet aussi de gérer un ZIP ayant un seul
      # dossier racine sans mélanger plusieurs projets.
      # ============================================================
      - name: Détection du dossier projet
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="$GITHUB_WORKSPACE/vanelle-source"

          if [ -f "$BUILD_ROOT/package.json" ] &&
             [ -d "$BUILD_ROOT/android" ]; then

            PROJECT_ROOT="$BUILD_ROOT"

          else
            CANDIDATES=()

            while IFS= read -r pkg; do
              CANDIDATES+=("$(dirname "$pkg")")
            done < <(
              find "$BUILD_ROOT" \
                -mindepth 1 \
                -maxdepth 3 \
                -name package.json \
                -type f \
                -print
            )

            if [ "${#CANDIDATES[@]}" -ne 1 ]; then
              echo "ERREUR : impossible d'identifier un unique projet Vanelle."
              echo "Projets détectés :"
              printf '%s\n' "${CANDIDATES[@]}"
              exit 1
            fi

            PROJECT_ROOT="${CANDIDATES[0]}"

            if [ ! -d "$PROJECT_ROOT/android" ]; then
              echo "ERREUR : le projet détecté ne contient pas android/."
              exit 1
            fi
          fi

          echo "Projet utilisé pour la compilation :"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$PROJECT_ROOT/android" >> "$GITHUB_ENV"

      # ============================================================
      # 5. CONTRÔLE DE L'INTÉGRITÉ DU PROJET
      #
      # On vérifie notamment que MainActivity et MainApplication
      # viennent bien du ZIP et existent avant toute compilation.
      # ============================================================
      - name: Vérification de l'intégrité du code Vanelle
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/package.json"
          test -f "$ANDROID_DIR/settings.gradle"

          test -f \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainActivity.kt"

          test -f \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainApplication.kt"

          test -f \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/EmbeddingEngine.kt"

          test -f \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/VanelleNativeModule.kt"

          test -f \
            "$ANDROID_DIR/app/src/main/cpp/CMakeLists.txt"

          test -f \
            "$ANDROID_DIR/app/src/main/cpp/llama_embedding_jni.cpp"

          echo
          echo "=== MainActivity.kt fourni par le ZIP ==="
          sed -n '1,80p' \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainActivity.kt"

          echo
          echo "=== MainApplication.kt fourni par le ZIP ==="
          sed -n '1,100p' \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainApplication.kt"

          echo
          echo "Projet Vanelle v13 validé."

      # ============================================================
      # 6. NODE.JS
      # ============================================================
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      # ============================================================
      # 7. JAVA
      # ============================================================
      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 8. ANDROID SDK
      # ============================================================
      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 9. DÉPENDANCES JAVASCRIPT
      # ============================================================
      - name: Installation des dépendances Node
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --include=dev --no-audit --no-fund
          else
            npm install --include=dev --no-audit --no-fund
          fi

          test -d node_modules/@react-native/gradle-plugin

      # ============================================================
      # 10. ANDROIDX UNIQUEMENT
      #
      # Aucun fichier Kotlin/Java n'est réécrit.
      # settings.gradle reste celui du ZIP.
      # ============================================================
      - name: Vérification AndroidX
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          GP="$ANDROID_DIR/gradle.properties"

          touch "$GP"

          grep -q '^android.useAndroidX=' "$GP" || \
            echo 'android.useAndroidX=true' >> "$GP"

          grep -q '^android.enableJetifier=' "$GP" || \
            echo 'android.enableJetifier=true' >> "$GP"

          echo "AndroidX configuré."

      # ============================================================
      # 11. VÉRIFICATION QUE LE WORKFLOW NE REMPLACE PAS
      # MainActivity / MainApplication / settings.gradle
      # ============================================================
      - name: Empreinte des fichiers natifs avant build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_ROOT/.workflow-checks"

          sha256sum \
            "$ANDROID_DIR/settings.gradle" \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainActivity.kt" \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/MainApplication.kt" \
            "$ANDROID_DIR/app/src/main/java/com/vanelle/app/EmbeddingEngine.kt" \
            "$ANDROID_DIR/app/src/main/cpp/llama_embedding_jni.cpp" \
            > "$PROJECT_ROOT/.workflow-checks/native-before.sha256"

          cat "$PROJECT_ROOT/.workflow-checks/native-before.sha256"

      # ============================================================
      # 12. PRÉPARATION DES MODÈLES IA
      #
      # Cette étape est conservée.
      # Elle utilise le script présent dans le ZIP source.
      #
      # Elle prépare notamment :
      # - SmolLM2
      # - Nomic Embed
      #
      # avec vérification SHA-256.
      # ============================================================
      - name: Préparation des modèles IA embarqués
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f scripts/prepare-bundled-models.sh ]; then
            echo "ERREUR : prepare-bundled-models.sh introuvable."
            exit 1
          fi

          chmod +x scripts/prepare-bundled-models.sh

          ./scripts/prepare-bundled-models.sh

          echo
          echo "=== Modèles GGUF préparés ==="

          find \
            "$ANDROID_DIR/app/src/main/assets/models" \
            -maxdepth 1 \
            -type f \
            -name '*.gguf' \
            -exec ls -lh {} \;

      # ============================================================
      # 13. VÉRIFICATION EMBEDDINGS
      # ============================================================
      - name: Vérification du bridge embeddings
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/verify-embedding-bridge.sh ]; then
            chmod +x scripts/verify-embedding-bridge.sh
            ./scripts/verify-embedding-bridge.sh
          else
            echo "Script de vérification embeddings absent."
          fi

      # ============================================================
      # 14. VÉRIFICATION DES FICHIERS APRÈS PRÉPARATION IA
      #
      # Le script des modèles n'a le droit de modifier que les assets.
      # ============================================================
      - name: Vérification anti-écrasement
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c "$PROJECT_ROOT/.workflow-checks/native-before.sha256"

          echo "OK : les fichiers natifs Vanelle sont inchangés."

      # ============================================================
      # 15. CLEAN GRADLE
      # ============================================================
      - name: Nettoyage Gradle
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew clean --no-daemon

      # ============================================================
      # 16. BUILD RELEASE
      #
      # IMPORTANT :
      # On utilise LE gradlew et LE projet provenant du ZIP.
      # Aucun settings.gradle n'est généré.
      # Aucun MainActivity n'est généré.
      # Aucun MainApplication n'est généré.
      # ============================================================
      - name: Compilation APK Release
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 17. APK
      # ============================================================
      - name: Recherche de l'APK Release
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$ANDROID_DIR/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            ! -name '*-unsigned.apk' \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            APK=$(find "$ANDROID_DIR/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              | head -n 1 || true)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERREUR : aucun APK trouvé."
            find "$ANDROID_DIR/app/build/outputs" \
              -type f \
              -print || true
            exit 1
          fi

          echo "APK Release : $APK"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 18. KEYSTORE
      # ============================================================
      - name: Génération du Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      # ============================================================
      # 19. ALIGNEMENT + SIGNATURE
      # ============================================================
      - name: Alignement et signature APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          test -n "$BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -v \
            -p \
            4 \
            "$UNSIGNED_APK" \
            app-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk \
            app-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            VanelleOS-release-signed.apk

          ls -lh VanelleOS-release-signed.apk

      # ============================================================
      # 20. RELEASE GITHUB
      # ============================================================
      - name: Publication GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VanelleOS ${{ github.run_number }}
          body: |
            VanelleOS Release.

            Source unique :
            Vanelle-Android-CRASHFIX-v13-FINAL.zip

            Le workflow :
            - extrait uniquement cette archive ;
            - ne fusionne aucun ancien ZIP ;
            - ne réécrit pas MainActivity.kt ;
            - ne réécrit pas MainApplication.kt ;
            - ne réécrit pas settings.gradle ;
            - prépare les modèles IA avec vérification SHA-256 ;
            - compile le projet extrait.
          files: VanelleOS-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 21. ARTIFACT
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-release-signed-${{ github.run_number }}
          path: VanelleOS-release-signed.apk
          retention-days: 30
