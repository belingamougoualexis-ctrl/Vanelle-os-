name: Vanelle OS - Full Workflow & Testing

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi

      - name: Configuration AndroidX et gestion des mascottes
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          mkdir -p app/src/main/res/drawable

          if [ ! -f "app/src/main/res/drawable/ic_launcher_foreground.xml" ] && [ ! -f "app/src/main/res/drawable/ic_launcher_foreground.png" ] && [ ! -f "app/src/main/res/drawable-nodpi/ic_launcher_foreground.png" ]; then
            echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FF6200EE" android:pathData="M37,29L61,29L61,35L37,35Z M37,43L71,43L71,49L37,49Z M37,57L71,57L71,63L37,63Z"/></vector>' > app/src/main/res/drawable/ic_launcher_foreground.xml
          fi

          if [ -f "app/src/main/java/com/vanelle/os/WebSearchHelper.kt" ]; then
            sed -i 's/= return /{ /g' app/src/main/java/com/vanelle/os/WebSearchHelper.kt || true
          fi

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compilation des APKs (ModernDebug & AndroidTest)
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : Aucun fichier Gradle trouvé."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Dossier du projet : $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleModernDebug assembleModernDebugAndroidTest --stacktrace
          else
            gradle assembleModernDebug assembleModernDebugAndroidTest --stacktrace
          fi

      - name: Configuration de KVM (Accélération Matérielle)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Exécution des Tests sur Émulateur Android (Toutes fonctionnalités)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Octroi automatique des permissions requises pour Vanelle OS avant les tests UI
            adb shell pm grant com.vanelle.os android.permission.RECORD_AUDIO || true
            adb shell pm grant com.vanelle.os android.permission.POST_NOTIFICATIONS || true
            adb shell appops set com.vanelle.os SYSTEM_ALERT_WINDOW allow || true
            
            ./gradlew connectedModernDebugAndroidTest --stacktrace

      - name: Génération du Keystore de signature
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -path "*/outputs/apk/modern/*" -name "*.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK 'modern' trouvé. Vérifie que assembleModernDebug a bien produit un résultat."
            find . -name "*.apk"
            exit 1
          fi

          echo "APK sélectionné : $UNSIGNED_APK"

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | tail -n 1)

          ${BUILD_TOOLS_DIR}/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out VanelleOS-release-signed.apk app-aligned.apk

      - name: Publication des rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vanelle-os-test-reports
          path: app/build/reports/androidTests/connected/

      - name: Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Release-APK
          path: VanelleOS-release-signed.apk
          if-no-files-found: error
