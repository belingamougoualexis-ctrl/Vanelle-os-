name: Vanelle Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f android/settings.gradle
          test -f android/build.gradle
          chmod +x android/gradlew
          test -x android/gradlew
          test -d android/app
          node -e "const p=require('./package.json'); if(p.dependencies?.['react-native']!=='0.87.0') process.exit(1); console.log('React Native:',p.dependencies['react-native'])"

      - name: Install JS dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund
          test -d node_modules/@react-native/gradle-plugin
          test -f node_modules/@react-native/gradle-plugin/package.json

      - name: Prepare bundled AI models
        shell: bash
        run: |
          chmod +x scripts/prepare-bundled-models.sh
          ./scripts/prepare-bundled-models.sh

      - name: Verify Android inputs
        shell: bash
        run: |
          set -euo pipefail
          test -d node_modules/@react-native/gradle-plugin
          test -f android/app/src/main/assets/models/smollm2-360m-instruct-q4_k_m.gguf
          test -f android/app/src/main/assets/models/nomic-embed-text-v1.5.Q4_K_M.gguf

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Vanelle-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
