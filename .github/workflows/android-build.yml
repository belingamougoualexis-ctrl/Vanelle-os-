name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Décompression des archives ZIP
        run: |
          set -euo pipefail
          ZIP_FILES=$(find . -maxdepth 3 -name "*.zip" | head -20 || true)
          if [ -n "$ZIP_FILES" ]; then
            for file in $ZIP_FILES; do
              echo "Décompression de : $file"
              unzip -o "$file"
            done
          fi

      - name: Débogage - Affichage de l'arborescence
        run: |
          echo "=== Contenu du répertoire racine ==="
          ls -la
          echo "=== Recherche des fichiers Gradle ==="
          find . -name "settings.gradle*" -o -name "build.gradle*" | grep -v node_modules || true

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Localisation du projet React Native
        id: root
        run: |
          set -euo pipefail

          # Recherche tolérante du fichier settings.gradle
          GRADLE_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v node_modules | head -n 1 || true)

          # Si aucun settings.gradle n'est trouvé, cherche un build.gradle dans un dossier android
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -path "*/android/build.gradle" -o -path "*/android/build.gradle.kts" | grep -v node_modules | head -n 1 || true)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Aucun fichier de configuration Gradle trouvé. Vérifiez que le dossier 'android' est bien commité dans le dépôt."
            exit 1
          fi

          ANDROID_DIR=$(cd "$(dirname "$GRADLE_FILE")" && pwd)
          RN_ROOT=$(cd "$ANDROID_DIR/.." && pwd)

          echo "Détection : Dossier Android = $ANDROID_DIR"
          echo "Détection : Racine React Native = $RN_ROOT"

          echo "root=$RN_ROOT" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Installation des dépendances Node
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund

      - name: Correctifs Gradle (AndroidX + désactiver R8 minify)
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          for gp in $(find . -name "gradle.properties" | grep -v node_modules); do
            grep -q "android.useAndroidX" "$gp" || echo "android.useAndroidX=true" >> "$gp"
            grep -q "android.enableJetifier" "$gp" || echo "android.enableJetifier=true" >> "$gp"
            echo "REACT_NATIVE_NODE_MODULES_DIR=$(pwd)/node_modules" >> "$gp"
          done
          for f in $(find . -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" | grep -v node_modules); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f"
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f"
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f"
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f"
          done

      - name: Préparation des modèles IA embarqués
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-bundled-models.sh scripts/verify-project.sh android/gradlew || true
          if [ -f "scripts/prepare-bundled-models.sh" ]; then
            ./scripts/prepare-bundled-models.sh
          fi

      - name: Compilation de l'APK Release
        working-directory: ${{ steps.root.outputs.android_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Trouver l'APK généré
        id: apk
        run: |
          set -euo pipefail
          APK=$(find "${{ steps.root.outputs.android_dir }}/app/build/outputs/apk/release" -name "*.apk" | grep -v "unsigned" | head -n 1 || true)
          
          if [ -z "$APK" ]; then
            APK=$(find "${{ steps.root.outputs.android_dir }}/app/build/outputs/apk" -name "*.apk" | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "::error::Aucun APK généré trouvé !"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Générer le Keystore et signer l'APK
        id: sign
        run: |
          set -euo pipefail
          
          KEYSTORE_PATH="release-generated.keystore"
          KEYSTORE_PASS="AutoGeneratedPass123!"
          ALIAS_NAME="releasekey"
          
          echo "Génération du keystore de secours..."
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ALIAS_NAME" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -dname "CN=AutomatedBuild, OU=Dev, O=App, L=City, S=State, C=US"

          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          
          UNSIGNED_APK="${{ steps.apk.outputs.path }}"
          ALIGNED_APK="app-aligned.apk"
          SIGNED_APK="$(dirname "$UNSIGNED_APK")/Vanelle-signed.apk"

          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --ks-key-alias "$ALIAS_NAME" \
            --key-pass pass:"$KEYSTORE_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Vanelle-signed-apk
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Créer une Release + attacher l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vanelle Release ${{ github.run_number }}
          body: |
            APK Release généré et signé automatiquement.
          files: ${{ steps.sign.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
