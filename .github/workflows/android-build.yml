name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Télécharger le projet
      uses: actions/checkout@v4

    - name: Installer Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Installer Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Décompresser le fichier ZIP
      run: |
        unzip -o *.zip -d dossier_decompresse

    - name: Nettoyer les fichiers non-images dans res/
      run: |
        find dossier_decompresse -type f -path "*/src/main/res/*" ! -name "*.xml" ! -name "*.png" ! -name "*.jpg" ! -name "*.webp" ! -name "*.gif" -delete || true

    - name: Appliquer l'icône du Robot VanelleOS
      run: |
        RES_DIR=$(find dossier_decompresse -type d -path "*/src/main/res" | head -n 1)

        mkdir -p "$RES_DIR/mipmap-hdpi"
        mkdir -p "$RES_DIR/mipmap-mdpi"
        mkdir -p "$RES_DIR/mipmap-xhdpi"
        mkdir -p "$RES_DIR/mipmap-xxhdpi"
        mkdir -p "$RES_DIR/mipmap-xxxhdpi"
        mkdir -p "$RES_DIR/mipmap-anydpi-v26"
        mkdir -p "$RES_DIR/drawable"

        cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_robot.xml"
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#F4F8FB" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#E3F2FD" android:pathData="M34,25 h40 a18,18 0 0,1 18,18 v14 a18,18 0 0,1 -18,18 h-40 a18,18 0 0,1 -18,-18 v-14 a18,18 0 0,1 18,-18 Z"/>
            <path android:fillColor="#BBDEFB" android:pathData="M34,25 h40 a18,18 0 0,1 18,18 v5 h-76 v-5 a18,18 0 0,1 18,-18 Z"/>
            <path android:fillColor="#1E88E5" android:pathData="M38,40 a6,8 0 1,0 12,0 a6,8 0 1,0 -12,0"/>
            <path android:fillColor="#1E88E5" android:pathData="M58,40 a6,8 0 1,0 12,0 a6,8 0 1,0 -12,0"/>
            <path android:fillColor="#1E88E5" android:pathData="M49,56 q5,4 10,0 t-10,0"/>
            <path android:fillColor="#E3F2FD" android:pathData="M38,72 h32 a10,10 0 0,1 10,10 v10 a10,10 0 0,1 -10,10 h-32 a10,10 0 0,1 -10,-10 v-10 a10,10 0 0,1 10,-10 Z"/>
            <path android:fillColor="#42A5F5" android:pathData="M42,77 h24 a4,4 0 0,1 4,4 v6 a4,4 0 0,1 -4,4 h-24 a4,4 0 0,1 -4,-4 v-6 a4,4 0 0,1 4,-4 Z"/>
        </vector>
        EOF

        cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/white" />
            <foreground android:drawable="@drawable/ic_launcher_robot" />
        </adaptive-icon>
        EOF

        cp "$RES_DIR/drawable/ic_launcher_robot.xml" "$RES_DIR/drawable/ic_launcher.xml" || true

    - name: Activer AndroidX au niveau global
      run: |
        mkdir -p ~/.gradle
        echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
        echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

        PROJ_DIR=$(find dossier_decompresse -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo "android.useAndroidX=true" >> "$PROJ_DIR/gradle.properties"
        echo "android.enableJetifier=true" >> "$PROJ_DIR/gradle.properties"

    - name: Compiler l'APK
      run: |
        PROJ_DIR=$(find dossier_decompresse -name "build.gradle*" -exec dirname {} \; | head -n 1)
        cd "$PROJ_DIR"
        gradle assembleDebug --stacktrace

    - name: Récupérer l'APK
      uses: actions/upload-artifact@v4
      with:
        name: VanelleOS-APK
        path: "**/*.apk"
