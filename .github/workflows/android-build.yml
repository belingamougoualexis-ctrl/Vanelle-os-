name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompresser l'archive ZIP si elle existe
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration de JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Correcteur de code Kotlin & Injection de dépendances
      - name: Auto-correction intégrale du code Kotlin
        run: |
          python3 - << 'EOF'
          import os, re, glob

          def find_files(pattern):
              return glob.glob(f"./**/{pattern}", recursive=True)

          # --- FIX 1: ContactsRepository.kt ---
          # Corrige les erreurs de syntaxe dues aux échappements invalides sans altérer .replace()
          for path in find_files("ContactsRepository.kt"):
              print(f"[Fix] Correction de la syntaxe dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              # Nettoie les antislashs problématiques
              content = re.sub(r'\\([_%\(\)])', r'\1', content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- FIX 2: Fragments.kt ---
          # Rescope les variables locales redéclarées (legalCol, privacyBtn, termsBtn)
          for path in find_files("Fragments.kt"):
              print(f"[Fix] Résolution des redéclarations dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              declared_vars = set()

              for line in lines:
                  # Réinitialise la portée à chaque nouvelle fonction
                  if "fun " in line or "override" in line:
                      declared_vars.clear()

                  match = re.search(r"^\s*val\s+(legalCol|privacyBtn|termsBtn)\b", line)
                  if match:
                      var_name = match.group(1)
                      if var_name in declared_vars:
                          # Transforme 'val varName =' en 'varName =' pour réutiliser la variable sans conflit
                          line = re.sub(r'\bval\s+' + var_name, var_name, line, count=1)
                      else:
                          declared_vars.add(var_name)
                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # --- FIX 3: MemoryVault.kt ---
          # Résout l'incompatibilité de type Context/String et injecte les imports MasterKey
          for path in find_files("MemoryVault.kt"):
              print(f"[Fix] Correction de MasterKey et Context dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Ajout des imports requis
              imports = (
                  "\nimport androidx.security.crypto.MasterKey\n"
                  "import androidx.security.crypto.EncryptedSharedPreferences\n"
              )
              if "import androidx.security.crypto" not in content:
                  content = re.sub(r'(package\s+[^\n]+)', r'\1' + imports, content, count=1)

              # Correction de la signature EncryptedSharedPreferences (Compatibilité version 1.1.0)
              content = content.replace(
                  'EncryptedSharedPreferences.create(context,',
                  'EncryptedSharedPreferences.create("secret_vault", MasterKey.Builder(context).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build().toString(), context,'
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # --- FIX 4: build.gradle ---
          # Injecte la librairie Security Crypto nécessaire à MasterKey
          gradle_files = find_files("build.gradle") + find_files("build.gradle.kts")
          for path in gradle_files:
              if "app" in path:
                  print(f"[Fix] Ajout de security-crypto dans : {path}")
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()

                  if "security-crypto" not in content:
                      dep = '\n    implementation "androidx.security:security-crypto:1.0.0"\n'
                      content = re.sub(r'dependencies\s*\{', 'dependencies {' + dep, content, count=1)
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          EOF

      # 4. Compilation Gradle
      - name: Compiler l'APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi

          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Export de l'APK généré
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
