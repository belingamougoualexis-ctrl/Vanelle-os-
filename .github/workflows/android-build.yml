name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code
        uses: actions/checkout@v4

      - name: 2. Extraction ciblée de VanelleOS_PRO_FINAL_AUDITED.zip
        run: |
          TARGET_ZIP="VanelleOS_PRO_FINAL_AUDITED.zip"

          if [ ! -f "$TARGET_ZIP" ]; then
            echo "ERREUR : Le fichier $TARGET_ZIP est introuvable à la racine."
            exit 1
          fi

          echo "Extraction de $TARGET_ZIP..."
          unzip -o "$TARGET_ZIP" -d extracted_project

          INTERNAL_DIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d)
          if [ $(echo "$INTERNAL_DIR" | wc -l) -eq 1 ]; then
            echo "Déplacement du contenu depuis le sous-dossier extrait..."
            cp -rn "$INTERNAL_DIR"/* . 2>/dev/null || cp -rn "$INTERNAL_DIR"/.* . 2>/dev/null || true
          else
            cp -rn extracted_project/* . 2>/dev/null || true
          fi

      - name: 3. Injection des règles ProGuard/R8
        run: |
          PROGUARD_FILE="app/proguard-rules.pro"
          
          # Création du fichier de règles s'il n'existe pas
          mkdir -p app
          touch "$PROGUARD_FILE"

          # Ajout des règles pour ignorer les avertissements JSR-305/Tink
          echo "" >> "$PROGUARD_FILE"
          echo "# Correctif automatique R8 injecté par CI" >> "$PROGUARD_FILE"
          echo "-dontwarn javax.annotation.**" >> "$PROGUARD_FILE"
          echo "-dontwarn javax.annotation.concurrent.**" >> "$PROGUARD_FILE"
          echo "-keep class com.google.crypto.tink.** { *; }" >> "$PROGUARD_FILE"

          echo "Règles ProGuard injectées dans $PROGUARD_FILE :"
          cat "$PROGUARD_FILE"

      - name: 4. Configuration de Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Installation de Gradle sur le serveur GitHub
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Génération automatique du Keystore
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: 7. Compilation de l'APK Release
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            echo "Wrapper gradlew non trouvé, utilisation de gradle système..."
            gradle assembleRelease --stacktrace
          fi

      - name: 8. Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun fichier APK trouvé après compilation."
            exit 1
          fi

          echo "APK non signé trouvé : $UNSIGNED_APK"

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out app-release-signed.apk app-aligned.apk

      - name: 9. Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: application-release-signee
          path: app-release-signed.apk
          if-no-files-found: error
