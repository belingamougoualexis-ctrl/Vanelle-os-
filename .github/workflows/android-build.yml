name: Build and Sign Release APK Automatically

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: write

jobs:
build-and-sign:
runs-on: ubuntu-latest

steps:
  # ------------------------------------------------------------
  # 1. Récupération du dépôt
  # ------------------------------------------------------------
  - name: Récupération du code source
    uses: actions/checkout@v4

  # ------------------------------------------------------------
  # 2. Affichage de la structure du dépôt
  # ------------------------------------------------------------
  - name: Vérification de la structure du projet
    shell: bash
    run: |
      set -euo pipefail

      echo "=== RACINE DU DÉPÔT ==="
      pwd
      ls -la

      echo ""
      echo "=== RECHERCHE package.json ==="
      find . -type f -name "package.json" \
        -not -path "*/node_modules/*" \
        -print

      echo ""
      echo "=== RECHERCHE PROJETS ANDROID ==="
      find . -type f \
        -name "settings.gradle" \
        -o -name "settings.gradle.kts" \
        -o -name "gradlew" \
      -not -path "*/node_modules/*" -print

  # ------------------------------------------------------------
  # 3. Décompression UNIQUEMENT si le dépôt contient réellement
  #    une archive de projet.
  # ------------------------------------------------------------
  - name: Décompression des archives de projet
    shell: bash
    run: |
      set -euo pipefail

      # Si Android existe déjà, on ne touche à rien.
      if find . -type f \
          -name "settings.gradle" \
          -o -name "settings.gradle.kts" \
        -not -path "*/node_modules/*" | grep -q .; then

        echo "Projet Gradle déjà présent."
        exit 0
      fi

      echo "Aucun projet Gradle détecté."

      ZIP_COUNT=0

      while IFS= read -r -d '' ZIP_FILE; do
        ZIP_COUNT=$((ZIP_COUNT + 1))

        echo "Archive trouvée : $ZIP_FILE"

        case "$ZIP_FILE" in
          *node_modules*|*.git/*)
            continue
            ;;
        esac

        mkdir -p .github/workspace-extract

        unzip -o "$ZIP_FILE" \
          -d .github/workspace-extract

      done < <(
        find . \
          -maxdepth 4 \
          -type f \
          -name "*.zip" \
          -not -path "./.git/*" \
          -not -path "*/node_modules/*" \
          -print0
      )

      if [ "$ZIP_COUNT" -gt 0 ]; then
        echo "Archives traitées : $ZIP_COUNT"
      fi

      # Déplacer le contenu extrait vers le workspace uniquement
      # lorsqu'il contient réellement un projet.
      GRADLE_AFTER_EXTRACT=$(
        find .github/workspace-extract \
          -type f \
          \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \
          -print -quit 2>/dev/null || true
      )

      if [ -n "$GRADLE_AFTER_EXTRACT" ]; then
        echo "Projet Android trouvé dans l'archive."

        EXTRACT_ROOT=$(dirname "$GRADLE_AFTER_EXTRACT")

        # Recherche du dossier Android réel.
        ANDROID_DIR=$(find .github/workspace-extract \
          -type f \
          \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \
          -not -path "*/node_modules/*" \
          -print -quit | xargs -r dirname)

        if [ -n "$ANDROID_DIR" ]; then
          echo "Dossier Android trouvé : $ANDROID_DIR"

          # On remonte jusqu'à la racine contenant package.json.
          PROJECT_ROOT=$(dirname "$ANDROID_DIR")

          while [ "$PROJECT_ROOT" != "." ] && \
                [ "$PROJECT_ROOT" != "/" ] && \
                [ ! -f "$PROJECT_ROOT/package.json" ]; do
            PROJECT_ROOT=$(dirname "$PROJECT_ROOT")
          done

          if [ -f "$PROJECT_ROOT/package.json" ]; then
            cp -a "$PROJECT_ROOT"/. .
            echo "Projet copié à la racine du workspace."
          else
            echo "::error::package.json introuvable dans le projet extrait."
            exit 1
          fi
        fi
      fi

  # ------------------------------------------------------------
  # 4. Détection fiable du projet Android
  # ------------------------------------------------------------
  - name: Localisation du projet React Native
    id: root
    shell: bash
    run: |
      set -euo pipefail

      echo "Recherche du projet Android..."

      SETTINGS_FILE=$(
        find . \
          -type f \
          \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \
          -not -path "./.git/*" \
          -not -path "*/node_modules/*" \
          -not -path "*/build/*" \
          -print -quit
      )

      if [ -z "$SETTINGS_FILE" ]; then
        echo "::error::Aucun settings.gradle trouvé."
        echo "::error::Ce dépôt ne contient pas de projet Android Gradle."
        echo ""
        echo "Fichiers trouvés :"
        find . -maxdepth 5 -type f \
          -not -path "./.git/*" \
          -not -path "*/node_modules/*" \
          | head -200
        exit 1
      fi

      ANDROID_DIR=$(cd "$(dirname "$SETTINGS_FILE")" && pwd)

      # Recherche de la racine React Native contenant package.json.
      CURRENT_DIR="$ANDROID_DIR"

      while [ "$CURRENT_DIR" != "/" ] && \
            [ ! -f "$CURRENT_DIR/package.json" ]; do
        CURRENT_DIR=$(dirname "$CURRENT_DIR")
      done

      if [ ! -f "$CURRENT_DIR/package.json" ]; then
        echo "::error::package.json introuvable au-dessus du dossier Android."
        exit 1
      fi

      RN_ROOT="$CURRENT_DIR"

      if [ ! -f "$ANDROID_DIR/gradlew" ]; then
        echo "::error::android/gradlew introuvable."
        exit 1
      fi

      echo "=========================================="
      echo "Projet React Native : $RN_ROOT"
      echo "Projet Android      : $ANDROID_DIR"
      echo "settings.gradle     : $SETTINGS_FILE"
      echo "=========================================="

      {
        echo "root=$RN_ROOT"
        echo "android_dir=$ANDROID_DIR"
      } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # 5. Node.js
  # ------------------------------------------------------------
  - name: Configuration de Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "22.13.0"
      cache: npm
      cache-dependency-path: ${{ steps.root.outputs.root }}/package-lock.json

  # ------------------------------------------------------------
  # 6. Java
  # ------------------------------------------------------------
  - name: Configuration de Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  # ------------------------------------------------------------
  # 7. Android SDK
  # ------------------------------------------------------------
  - name: Configuration Android SDK
    uses: android-actions/setup-android@v3

  # ------------------------------------------------------------
  # 8. Dépendances
  # ------------------------------------------------------------
  - name: Installation des dépendances Node
    working-directory: ${{ steps.root.outputs.root }}
    shell: bash
    run: |
      set -euo pipefail

      if [ -f package-lock.json ]; then
        npm ci --include=dev --no-audit --no-fund
      else
        echo "::warning::package-lock.json absent, utilisation de npm install."
        npm install --include=dev --no-audit --no-fund
      fi

  # ------------------------------------------------------------
  # 9. Vérifications du projet
  # ------------------------------------------------------------
  - name: Vérification du projet
    working-directory: ${{ steps.root.outputs.root }}
    shell: bash
    run: |
      set -euo pipefail

      test -f package.json
      test -f android/settings.gradle || \
      test -f android/settings.gradle.kts
      test -f android/gradlew

      chmod +x android/gradlew

      echo "Projet Android correctement détecté."

  # ------------------------------------------------------------
  # 10. Préparation des modèles IA
  # ------------------------------------------------------------
  - name: Préparation des modèles IA embarqués
    working-directory: ${{ steps.root.outputs.root }}
    shell: bash
    run: |
      set -euo pipefail

      if [ -f "scripts/prepare-bundled-models.sh" ]; then
        chmod +x scripts/prepare-bundled-models.sh
        ./scripts/prepare-bundled-models.sh
      else
        echo "Aucun script de préparation des modèles."
      fi

  # ------------------------------------------------------------
  # 11. Build APK Release
  # ------------------------------------------------------------
  - name: Compilation APK Release
    working-directory: ${{ steps.root.outputs.android_dir }}
    shell: bash
    run: |
      set -euo pipefail

      chmod +x ./gradlew

      ./gradlew \
        :app:assembleRelease \
        --no-daemon \
        --stacktrace

  # ------------------------------------------------------------
  # 12. Recherche APK
  # ------------------------------------------------------------
  - name: Recherche de l'APK
    id: apk
    shell: bash
    run: |
      set -euo pipefail

      APK_DIR="${{ steps.root.outputs.android_dir }}/app/build/outputs/apk"

      APK=$(
        find "$APK_DIR" \
          -type f \
          -name "*.apk" \
          -not -name "*unsigned*" \
          -print -quit 2>/dev/null || true
      )

      if [ -z "$APK" ]; then
        APK=$(
          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit 2>/dev/null || true
        )
      fi

      if [ -z "$APK" ]; then
        echo "::error::Aucun APK généré."
        exit 1
      fi

      echo "APK trouvé : $APK"

      {
        echo "path=$APK"
        echo "name=$(basename "$APK")"
      } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # 13. Génération du keystore
  # ------------------------------------------------------------
  - name: Génération du keystore
    shell: bash
    run: |
      set -euo pipefail

      KEYSTORE_PATH="$RUNNER_TEMP/vanelle-release.keystore"

      # Mot de passe temporaire uniquement pour cette compilation.
      KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      if [ -z "$KEYSTORE_PASS" ]; then
        echo "::error::Le secret ANDROID_KEYSTORE_PASSWORD n'est pas configuré."
        exit 1
      fi

      keytool -genkeypair \
        -v \
        -keystore "$KEYSTORE_PATH" \
        -alias "releasekey" \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -storepass "$KEYSTORE_PASS" \
        -keypass "$KEYSTORE_PASS" \
        -dname "CN=Vanelle"

      echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

  # ------------------------------------------------------------
  # 14. Signature APK
  # ------------------------------------------------------------
  - name: Signature de l'APK
    id: sign
    shell: bash
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    run: |
      set -euo pipefail

      UNSIGNED_APK="${{ steps.apk.outputs.path }}"
      SIGNED_APK="$(dirname "$UNSIGNED_APK")/Vanelle-signed.apk"
      ALIGNED_APK="$RUNNER_TEMP/Vanelle-aligned.apk"

      BUILD_TOOLS_DIR=$(
        find "$ANDROID_SDK_ROOT/build-tools" \
          -mindepth 1 \
          -maxdepth 1 \
          -type d \
          | sort -V \
          | tail -n 1
      )

      "$BUILD_TOOLS_DIR/zipalign" \
        -f \
        -p \
        4 \
        "$UNSIGNED_APK" \
        "$ALIGNED_APK"

      "$BUILD_TOOLS_DIR/apksigner" sign \
        --ks "$KEYSTORE_PATH" \
        --ks-pass env:KEYSTORE_PASSWORD \
        --ks-key-alias releasekey \
        --key-pass env:KEYSTORE_PASSWORD \
        --out "$SIGNED_APK" \
        "$ALIGNED_APK"

      "$BUILD_TOOLS_DIR/apksigner" verify \
        --verbose \
        "$SIGNED_APK"

      echo "path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # 15. Artifact
  # ------------------------------------------------------------
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Vanelle-signed-apk
      path: ${{ steps.sign.outputs.path }}
      if-no-files-found: error
      retention-days: 30

  # ------------------------------------------------------------
  # 16. GitHub Release
  # ------------------------------------------------------------
  - name: Créer la Release GitHub
    uses: softprops/action-gh-release@v2
    with:
      tag_name: v${{ github.run_number }}
      name: Vanelle Release ${{ github.run_number }}
      body: |
        APK Release Vanelle généré et signé automatiquement.
      files: ${{ steps.sign.outputs.path }}
      draft: false
      prerelease: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
