name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration Android SDK
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o "$HOME/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$HOME/cmdline-tools.zip" -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm -f "$HOME/cmdline-tools.zip"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          (set +o pipefail; yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null)
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraire le projet NEXUS + compiler l'APK release
        run: |
          set -euo pipefail
          echo "=== Contenu du dépôt ==="
          ls -la

          # Extraire tous les ZIP à la racine (ex: NEXUS-Android-v1_2_0-final.zip)
          find . -maxdepth 2 -type f -name "*.zip" | while read -r z; do
            echo ">>> Décompression de $z"
            unzip -o "$z"
          done

          echo "=== Après décompression ==="
          ls -la

          # Localiser le projet Android NEXUS
          if [ -f "./nexus/settings.gradle.kts" ]; then
            ANDROID_DIR="./nexus"
          elif [ -f "./settings.gradle.kts" ]; then
            ANDROID_DIR="."
          else
            GRADLE_FILE=$(find . \( -name "settings.gradle.kts" -o -name "settings.gradle" \) 2>/dev/null \
              | grep -v node_modules | head -n 1 || true)
            if [ -z "$GRADLE_FILE" ]; then
              echo "ERREUR : Aucun settings.gradle trouvé après décompression."
              find . -maxdepth 5 -type f | head -50
              exit 1
            fi
            ANDROID_DIR=$(dirname "$GRADLE_FILE")
          fi

          echo "ANDROID_DIR=$ANDROID_DIR"
          cd "$ANDROID_DIR"
          ls -la

          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "org.gradle.jvmargs" gradle.properties || echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          for f in $(find . \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) 2>/dev/null); do
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' "$f" || true
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' "$f" || true
            sed -i 's/minifyEnabled\s\+true/minifyEnabled false/g' "$f" || true
            sed -i 's/shrinkResources\s\+true/shrinkResources false/g' "$f" || true
          done

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            if ./gradlew --version >/dev/null 2>&1; then
              ./gradlew :app:assembleRelease --stacktrace --no-daemon
            else
              echo "gradlew invalide → installation Gradle 8.11.1"
              curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
              unzip -q /tmp/gradle.zip -d /tmp
              /tmp/gradle-8.11.1/bin/gradle :app:assembleRelease --stacktrace --no-daemon
            fi
          else
            echo "gradlew absent → installation Gradle 8.11.1"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle :app:assembleRelease --stacktrace --no-daemon
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Alignement et Signature de l'APK (vrai Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*" -name "*.apk" | head -n 1 || true)
          if [ -z "${UNSIGNED_APK:-}" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "Erreur : Aucun APK trouvé."
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK trouvé : $UNSIGNED_APK"

          if [ -z "\( {KEYSTORE_BASE64:-}" ] || [ -z " \){KEYSTORE_PASSWORD:-}" ] || [ -z "\( {KEY_ALIAS:-}" ] || [ -z " \){KEY_PASSWORD:-}" ]; then
            echo "ERREUR : secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD manquants."
            echo "Ajoutez-les dans Settings > Secrets and variables > Actions du dépôt."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "$HOME/android-sdk" ]; then
            SDK="$HOME/android-sdk"
          elif [ -d "$HOME/Android/Sdk" ]; then
            SDK="$HOME/Android/Sdk"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            ZIPALIGN_PATH=$(find /usr -name zipalign 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIPALIGN_PATH" ]; then
              SDK=\( (dirname " \)(dirname "$(dirname "$ZIPALIGN_PATH")")")
            else
              echo "ERREUR : SDK Android introuvable"
              exit 1
            fi
          fi
          echo "SDK=$SDK"

          BUILD_TOOLS_DIR=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "${BUILD_TOOLS_DIR:-}" ] || [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "ERREUR : build-tools introuvable sous $SDK"
            ls -la "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "Build-tools : $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out NEXUS-release-signed.apk \
            app-aligned.apk

          rm -f release.jks
          ls -la NEXUS-release-signed.apk

      - name: Publication sur GitHub Releases
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NEXUS ${{ github.run_number }}
          body: |
            APK release signé automatiquement (NEXUS — Android).
            ATTENTION : désinstallez l'ancienne version avant d'installer celle-ci si la signature a changé.
          files: NEXUS-release-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lien de téléchargement
        run: |
          echo "## NEXUS - APK disponible" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Page de la release : ${{ steps.publish_release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Téléchargement direct de l'APK :" >> "$GITHUB_STEP_SUMMARY"
          for asset_url in \( (echo ' \){{ steps.publish_release.outputs.assets }}' | grep -o '"browser_download_url":"[^"]*"' | cut -d'"' -f4); do
            echo "- $asset_url" >> "$GITHUB_STEP_SUMMARY"
          done
