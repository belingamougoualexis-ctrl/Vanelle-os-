name: Générer l'APK VanelleOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 1. Décompresser le ZIP en premier pour extraire les fichiers du projet
      - name: Décompresser l'archive ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive ZIP trouvée : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dossier_decompresse
          fi

      # 2. Configuration de JDK 17
      - name: Configuration de JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Application des corrections dans le code Kotlin via un script Python sécurisé
      - name: Corriger le code Kotlin
        run: |
          python3 - << 'EOF'
          import os, re, glob

          def find_files(name):
              return glob.glob(f"./**/{name}", recursive=True)

          # Fix 1: ContactsRepository.kt (Séquences d'échappement)
          for path in find_files("ContactsRepository.kt"):
              print(f"Nettoyage des échappements dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace(r"\%", "%").replace(r"\_", "_")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # Fix 2: WakeWordService.kt (Syntaxe et imports)
          for path in find_files("WakeWordService.kt"):
              print(f"Correction des imports dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              lines = [l for l in lines if not l.strip() == "import android.os.Bundle"]
              
              new_lines = []
              package_found = False
              for line in lines:
                  new_lines.append(line)
                  if line.strip().startswith("package ") and not package_found:
                      new_lines.append("\nimport android.os.Bundle\n")
                      package_found = True
              
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # Fix 3: Fragments.kt (Variables en doublon)
          for path in find_files("Fragments.kt"):
              print(f"Résolution des variables en doublon dans : {path}")
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              seen_vars = set()
              new_lines = []
              for line in lines:
                  match = re.search(r"^\s*val\s+(legalCol|privacyBtn|termsBtn)\b", line)
                  if match:
                      var_name = match.group(1)
                      if var_name in seen_vars:
                          line = line.replace("val " + var_name, var_name, 1)
                      else:
                          seen_vars.add(var_name)
                  elif "override fun" in line or "fun " in line:
                      seen_vars.clear()
                  new_lines.append(line)

              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
          EOF

      # 4. Lancement de Gradle
      - name: Compiler avec Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew introuvable !"
            exit 1
          fi
          
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Dossier du projet : $DIR"
          cd "$DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apk/" \;

      # 5. Vérification
      - name: Vérifier la présence de l'APK
        run: |
          echo "Contenu du dossier d'exportation :"
          ls -la "$GITHUB_WORKSPACE/output_apk"

      # 6. Téléversement de l'artifact
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VanelleOS-Debug-APK
          path: output_apk/*.apk
          if-no-files-found: error
