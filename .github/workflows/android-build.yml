name: Build and Sign Release APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 2. Vérification de la structure des fichiers
        run: ls -la

      - name: 3. Configuration de Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Rendre Gradle exécutable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            find . -name "gradlew" -exec chmod +x {} +
          fi

      - name: 5. Génération automatique du Keystore
        run: |
          keytool -genkeypair -v \
            -keystore autogenerated.jks \
            -alias autokey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass automatch123 \
            -keypass automatch123 \
            -dname "CN=GitHub Actions, OU=Build, O=Auto, L=City, S=State, C=US"

      - name: 6. Compilation de l'APK Release
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            # Si le projet est dans un sous-dossier, on se déplace dedans
            GRADLE_DIR=$(dirname $(find . -maxdepth 3 -name "gradlew" | head -n 1))
            cd "$GRADLE_DIR"
            ./gradlew assembleRelease --stacktrace
          fi

      - name: 7. Alignement et Signature de l'APK
        run: |
          UNSIGNED_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          echo "APK trouvé : $UNSIGNED_APK"

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner sign \
            --ks autogenerated.jks \
            --ks-pass pass:automatch123 \
            --key-pass pass:automatch123 \
            --ks-key-alias autokey \
            --out app-release-signed.apk app-aligned.apk

      - name: 8. Publication de l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: application-release-signee
          path: app-release-signed.apk
          if-no-files-found: error
