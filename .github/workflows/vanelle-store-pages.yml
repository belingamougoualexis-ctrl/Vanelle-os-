name: Vanelle Store — GitHub Pages
on:
  push:
    branches: [vanelle-ai-training]
    paths:
      - 'site/**'
      - '.github/workflows/vanelle-store-pages.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete store
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4