name: Vanelle Windows — real build

on:
  push:
    branches: [vanelle-ai-training]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          install_lavapipe: true
          cache: true
          stripdown: true

      - name: Build Vanelle
        shell: pwsh
        run: ./scripts/build-vanelle.ps1

      - name: Verify application and universal engine
        shell: pwsh
        run: |
          $root = "out/src-tauri"
          $release = "$root/target/x86_64-pc-windows-msvc/release"
          if (!(Test-Path "$root/universal_engine/hf_train.py")) { throw "HF training engine missing" }
          if (!(Test-Path "$root/universal_engine/hf_eval.py")) { throw "HF evaluation engine missing" }
          if (!(Test-Path "$root/universal_engine/hf_chat.py")) { throw "HF chat engine missing" }
          $setup = Get-ChildItem "$release/bundle/nsis" -Filter *.exe -File -ErrorAction Stop | Select-Object -First 1
          $app = Get-ChildItem $release -Filter "vanelle-local.exe" -File -ErrorAction Stop | Select-Object -First 1
          if (!$setup) { throw "NSIS installer missing" }
          if (!$app) { throw "Portable app missing" }
          $setup | Select-Object FullName,Length
          $app | Select-Object FullName,Length

      - name: GGUF engine real smoke test
        shell: pwsh
        run: |
          $model = "$env:RUNNER_TEMP/tinyllama-q2.gguf"
          Invoke-WebRequest -Uri "https://huggingface.co/tensorblock/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/TinyLlama-1.1B-Chat-v1.0-Q2_K.gguf?download=true" -OutFile $model
          if ((Get-Item $model).Length -lt 100000000) { throw "Real GGUF test model is incomplete" }
          $cpu = (Get-ChildItem "out/src-tauri/binaries" -Filter "llama-server-cpu-*.exe" | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $cpu -ArgumentList @("-m",$model,"--host","127.0.0.1","--port","18281","--ctx-size","512","--n-gpu-layers","0") -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            1..120 | ForEach-Object { if (!$ready) { try { $r=Invoke-WebRequest "http://127.0.0.1:18281/health" -UseBasicParsing; if ($r.StatusCode -eq 200) {$ready=$true} } catch {}; Start-Sleep -Milliseconds 500 } }
            if (!$ready) { throw "Real CPU engine did not become ready" }
            $body = @{model="tinyllama";messages=@(@{role="user";content="Say TEST_VANELLE_OK"});max_tokens=16;temperature=0;stream=$false} | ConvertTo-Json -Depth 6
            $resp=Invoke-RestMethod -Uri "http://127.0.0.1:18281/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body
            if ([string]::IsNullOrWhiteSpace([string]$resp.choices[0].message.content)) { throw "Real CPU chat returned empty output" }
            Write-Host "REAL_GGUF_CHAT_OK"
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Publish Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $setup = Get-ChildItem "out/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe -File | Select-Object -First 1
          $portable = Get-ChildItem "out/src-tauri/target/x86_64-pc-windows-msvc/release" -Filter "vanelle-local.exe" -File | Select-Object -First 1
          Copy-Item $setup.FullName "$releaseDir/Vanelle-Local-Windows-x64-Setup.exe" -Force
          Copy-Item $portable.FullName "$releaseDir/Vanelle-Local-Windows-x64-Portable.exe" -Force
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "$releaseDir/Vanelle-Local-Windows-x64.zip" -Force
          gh release delete vanelle-local-latest --yes --cleanup-tag 2>$null
          gh release create vanelle-local-latest "$releaseDir/Vanelle-Local-Windows-x64-Setup.exe" "$releaseDir/Vanelle-Local-Windows-x64-Portable.exe" "$releaseDir/Vanelle-Local-Windows-x64.zip" --target $env:GITHUB_SHA --title "Vanelle Local Windows x64" --notes "Real build and GGUF smoke validation from GitHub Actions." --latest=false