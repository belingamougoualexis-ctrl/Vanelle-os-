<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mises à jour Vanelle AI</title><meta name="description" content="Journal des mises à jour de Vanelle AI."><meta name="robots" content="index,follow"><link rel="canonical" href="https://belingamougoualexis-ctrl.github.io/Vanelle-os-/updates.html"><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="./">VANELLE<span>AI</span></a><a class="secondary" href="./">Accueil</a></header><main class="page"><div class="badge">CHANGELOG</div><h1>Mises à jour</h1><p>Le journal se synchronise avec les releases publiques du projet.</p><div id="changelog"><div class="loading">Chargement…</div></div></main><footer><span>Vanelle AI</span><a href="./">Accueil</a></footer><script>fetch("https://api.github.com/repos/belingamougoualexis-ctrl/Vanelle-os-/releases?per_page=30").then(r=>r.json()).then(rs=>{document.getElementById("changelog").innerHTML=rs.map(r=>'<div class="card"><div class="release-tag">'+String(r.tag_name).replace(/[&<>"']/g,"")+'</div><h2>'+String(r.name||r.tag_name).replace(/[&<>"']/g,"")+'</h2><p>'+new Date(r.published_at||r.created_at).toLocaleDateString("fr-FR")+'</p><p>'+String(r.body||"Consultez les notes complètes de la release.").replace(/[&<>"']/g,"").replace(/\r?\n/g," ")+'</p><a class="secondary" href="'+r.html_url+'">Voir la release</a></div>').join("")||'<div class="card">Aucune mise à jour publiée.</div>'}).catch(()=>{});</script></body></html>
