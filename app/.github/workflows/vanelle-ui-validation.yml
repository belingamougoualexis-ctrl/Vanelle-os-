name: Vanelle UI — real build validation

on:
  push:
    branches: [vanelle-ai-training]
    paths:
      - "app/**"
      - ".github/workflows/vanelle-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build React UI
        run: npm run build
      - name: Verify Tauri files
        run: |
          test -f src-tauri/tauri.conf.json
          test -f src-tauri/Cargo.toml
          test -f src/main.jsx
